<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Luma | Home</title>

    <link href="../src/output.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="bg-gray-100 font-nunito">
    <div data-component="sidebar"></div>

    <header class="relative bg-white">
      <div data-component="navbar"></div>
      <div id="hero-container" data-component="hero"></div>
    </header>

    <div class="flex flex-col min-h-screen px-10">
      <main class="flex-1 py-10 px-4 sm:px-6 lg:px-12 space-y-20">
        <!-- Events Section -->
        <section class="space-y-12">
          <a href="/event/index.html">
            <h2 class="text-2xl font-bold text-gray-800 font-nunito">Events</h2>
          </a>

          <!-- Trending Events -->
          <div class="space-y-4">
            <h3 class="text-lg font-semibold text-gray-700 font-nunito">
              Trending
            </h3>
            <div class="flex flex-row gap-4">
              <div class=" w-[297px] h-[300px] border-2 border-black bg-white rounded-2xl shadow"></div>
              <div class=" w-[297px] h-[300px] border-2 border-black bg-white rounded-2xl shadow"></div>
              <div class=" w-[297px] h-[300px] border-2 border-black bg-white rounded-2xl shadow"></div>
              <div class=" w-[297px] h-[300px] border-2 border-black bg-white rounded-2xl shadow"></div>
              <div class=" w-[297px] h-[300px] border-2 border-black bg-white rounded-2xl shadow"></div>
              <div class=" w-[297px] h-[300px] border-2 border-black bg-white rounded-2xl shadow"></div>
            </div>
          </div>

          <!-- Upcoming Events -->
          <div class="space-y-4">
            <h3 class="text-lg font-semibold text-gray-700 font-nunito">
              Upcoming
            </h3>
            <div class="flex gap-4">
              <div class=" w-[297px] h-[300px] border-2 border-black bg-white rounded-2xl shadow"></div>
              <div class=" w-[297px] h-[300px] border-2 border-black bg-white rounded-2xl shadow"></div>
              <div class=" w-[297px] h-[300px] border-2 border-black bg-white rounded-2xl shadow"></div>
              <div class=" w-[297px] h-[300px] border-2 border-black bg-white rounded-2xl shadow"></div>
              <div class=" w-[297px] h-[300px] border-2 border-black bg-white rounded-2xl shadow"></div>
              <div class=" w-[297px] h-[300px] border-2 border-black bg-white rounded-2xl shadow"></div>
            </div>
          </div>
        </section>

        <!-- Games Section -->
        <section class="space-y-12">
          <h2 class="text-2xl font-bold text-gray-800 font-nunito">Games</h2>

          <!-- Trending Games -->
          <div class="space-y-4">
            <h3 class="text-lg font-semibold text-gray-700 font-nunito">
              Trending
            </h3>
            <div class="flex gap-4">
              <div class=" w-[297px] h-[300px] border-2 border-black bg-white rounded-2xl shadow"></div>
              <div class=" w-[297px] h-[300px] border-2 border-black bg-white rounded-2xl shadow"></div>
              <div class=" w-[297px] h-[300px] border-2 border-black bg-white rounded-2xl shadow"></div>
              <div class=" w-[297px] h-[300px] border-2 border-black bg-white rounded-2xl shadow"></div>
              <div class=" w-[297px] h-[300px] border-2 border-black bg-white rounded-2xl shadow"></div>
              <div class=" w-[297px] h-[300px] border-2 border-black bg-white rounded-2xl shadow"></div>
            </div>
          </div>

          <!-- Continue Learning -->
          <div class="space-y-4">
            <h3 class="text-lg font-semibold text-gray-700 font-nunito">
              Continue Learning
            </h3>
            <div class="flex gap-4">
              <div class=" w-[297px] h-[300px] border-2 border-black bg-white rounded-2xl shadow"></div>
              <div class=" w-[297px] h-[300px] border-2 border-black bg-white rounded-2xl shadow"></div>
              <div class=" w-[297px] h-[300px] border-2 border-black bg-white rounded-2xl shadow"></div>
              <div class=" w-[297px] h-[300px] border-2 border-black bg-white rounded-2xl shadow"></div>
              <div class=" w-[297px] h-[300px] border-2 border-black bg-white rounded-2xl shadow"></div>
              <div class=" w-[297px] h-[300px] border-2 border-black bg-white rounded-2xl shadow"></div>
            </div>
          </div>
        </section>
      </main>
    </div>
    <div data-component="footer"></div>
    <script src="../js/inject.js" defer></script>
    <script src="../js/main.js" defer></script>
    <script src="../js/hero-carousel.js" defer></script>
  </body>
</html>
