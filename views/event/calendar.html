<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Luma | Event Details</title>
  <link href="../../src/output.css" rel="stylesheet" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <link href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" rel="stylesheet" />
  <link rel="shortcut icon" href="/src/asset/images/Luma - Icon 1.png" />
  <style>
    /* Tailwind-inspired Flatpickr customization */
    .flatpickr-day.selected,
    .flatpickr-day.today {
      background-color: #1f2937 !important;
      /* gray-800 */
      color: #f59275 !important;
      /* yellow-400 */
    }

    .flatpickr-day:hover {
      background-color: #4b5563 !important;
      /* gray-600 */
    }

    .flatpickr-calendar {
      /* border: 2px solid #f59275; */
      /* Change to your desired border color */
      background: transparent !important;
      backdrop-filter: blur(8px);
      /* Optional: adds a blur effect */
      border-radius: 0.5rem;
      /* Optional: rounded corners */
      box-shadow: none;
      /* Optional: remove default shadow */
    }

    .flatpickr-months .flatpickr-prev-month,
    .flatpickr-months .flatpickr-next-month,
    .flatpickr-current-month {
      color: white;
      fill: white;
    }

    span.flatpickr-weekday {
      color: rgb(255 255 255 / 54%);
    }

    .flatpickr-day {
      color: #a4a4a4;
    }

    .flatpickr-day.prevMonthDay,
    .flatpickr-day.nextMonthDay {
      color: rgb(183 183 183 / 30%);
    }

    /* Custom styles for days with events */
    .flatpickr-day.has-registered-events {
      background-color: #f59275 !important;
      color: white !important;
      font-weight: bold !important;
      border-radius: 50% !important;
    }

    .flatpickr-day.has-registered-events:hover {
      background-color: #f1647a !important;
    }

    .flatpickr-day.has-added-events {
      background-color: transparent !important;
      color: #f59275 !important;
      font-weight: bold !important;
      border: 2px solid #f59275 !important;
      border-radius: 50% !important;
    }

    .flatpickr-day.has-added-events:hover {
      background-color: rgba(245, 146, 117, 0.1) !important;
    }

    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    #calendar-wrapper {
      display: none;
    }

    @media (min-width: 1024px) {
      #calendar-wrapper {
        display: block;
      }
    }
  </style>
</head>

<body class="bg-gray-100">
  <div data-component="sidebar"></div>

  <div class="flex-1 flex flex-col min-h-screen md:ml-[80px] pt-5">

    <!-- calendar section -->
    <main class="flex-1 py-5 md:py-10 px-4 md:px-20">
      <!-- Mobile Date Picker -->
      <div class="block lg:hidden">
        <label for="calendar-mobile" class="text-2xl font-semibold luma-gradient">Select a Date</label>
        <input type="text" id="calendar-mobile" placeholder="Choose a date"
          class="w-full bg-gray-400/70 text-gray-800 p-2 mb-3 rounded-lg border border-gray-800 mt-10" />
      </div>

      <!-- Container -->
      <div
        class="w-full max-w-7xl mx-auto bg-[#262C3D] rounded-2xl shadow-lg overflow-hidden grid grid-cols-1 md:grid-cols-[1fr_auto] mb-10">
        <!-- Left: Event card or message -->
        <div class="px-3 sm:px-6 md:py-8 flex items-center justify-center bg-gray-800 w-full relative"
          id="calendar-event-card-wrapper">
          <!-- Content injected by JS -->
        </div>

        <!-- Right: Full Calendar (Desktop only) -->
        <div id="calendar-wrapper" class="p-6 hidden md:block">
          <h2 class="text-xl font-semibold mb-4 luma-gradient">Select a Date</h2>
          <div>
            <div id="calendar"
              class="bg-transparent rounded-lg text-black p-2 hidden shadow-md border border-[#f1647a]"></div>
          </div>
        </div>
      </div>

      <!-- horizontal scrollable cards without floating buttons -->
      <div class="w-full">
        <h2 class="text-2xl font-semibold mb-10 luma-gradient">
          Suggested Calendars
        </h2>

        <div class="relative">
          <!-- Left Scroll Button -->
          <button id="scrollLeftSuggestCalendars"
            class="absolute -left-14 top-1/2 w-12 h-12 -translate-y-1/2 z-30 bg-white/30 text-white p-2 rounded-full hidden md:block cursor-pointer hover:bg-white/20 transition-colors">
            <i class="fa-solid fa-angle-left"></i>
          </button>

          <div id="scroll-cards" class="flex overflow-x-auto pb-4 no-scrollbar m-0 p-0">
            <p class="text-gray-400">Processing...</p>
          </div>

          <!-- Right Scroll Button -->
          <button id="scrollRightSuggestCalendars"
            class="absolute -right-14 top-1/2 w-12 h-12 -translate-y-1/2 z-30 bg-white/30 text-white p-2 rounded-full hidden md:block cursor-pointer hover:bg-white/20 transition-colors">
            <i class="fa-solid fa-angle-right"></i>
          </button>
        </div>
      </div>

      <br />
      <br />

      <div class="w-full">
        <h2 class="text-2xl font-semibold mb-10 luma-gradient">
          Subscribed Calendars
        </h2>
        <!-- Subscribed Calendars -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-10" id="subscribedCalendarsGrid">
          <!-- Dynamic subscription cards will be injected here -->
        </div>
      </div>

      <!-- Tailwind line-clamp plugin required for ... truncation -->
      <style>
        .no-scrollbar::-webkit-scrollbar {
          display: none;
        }

        .no-scrollbar {
          -ms-overflow-style: none;
          scrollbar-width: none;
        }
      </style>
    </main>
  </div>
  <div data-component="footer"></div>
  <script src="../../js/inject.js" defer></script>
  <script type="module" src="../../js/auth/signout.js"></script>

  <!-- Authentication Guard -->
  <script type="module">
    import { initAuthGuard } from "../../js/auth/authGuard.js";
    initAuthGuard();
  </script>

  <!-- Calendar Events Script -->
  <script type="module">
    import { db } from "../../config/firebase.js";
    import {
      collection,
      getDocs,
      doc,
      getDoc,
      setDoc,
      deleteDoc,
      query,
      where,
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { getCurrentUser } from "../../js/auth/authGuard.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { auth } from "../../config/firebase.js";

    // Store user's calendar events
    let userCalendarEvents = [];
    let userRegisteredEvents = [];
    let selectedDate = null;

    // Initialize calendar when DOM is loaded and auth is ready
    document.addEventListener("DOMContentLoaded", () => {
      // Wait for auth state to be ready
      onAuthStateChanged(auth, async (user) => {
        if (user) {
          // User is authenticated, initialize calendar
          await initializeCalendar();
        } else {
          // User is not authenticated, show empty calendar
          setupEmptyCalendar();
        }
      });
    });

    async function initializeCalendar() {
      const user = getCurrentUser();
      console.log("Initializing calendar for user:", user);

      try {
        console.log("Loading user calendar events...");
        // Load user's calendar events and registrations
        await Promise.all([
          loadUserCalendarEvents(),
          loadUserRegistrations(),
        ]);

        console.log("Setting up calendar with events...");
        // Setup calendar with real events
        setupCalendarWithEvents();

        console.log("Loading suggested calendars...");
        // Load suggested calendars
        await loadSuggestedCalendars();

        console.log("Loading subscribed calendars...");
        // Load subscribed calendars
        await loadSubscribedCalendars();

        console.log("Calendar initialization complete");
      } catch (error) {
        console.error("Error initializing calendar:", error);
        console.log("Falling back to empty calendar");
        setupEmptyCalendar();
      }
    }

    async function loadUserCalendarEvents() {
      const user = getCurrentUser();
      if (!user || !user.userId) return;

      try {
        const calendarCol = collection(db, "users", user.userId, "calendar");
        const snapshot = await getDocs(calendarCol);

        userCalendarEvents = [];
        for (const docSnap of snapshot.docs) {
          const eventData = docSnap.data();
          // Get the full event details from the events collection
          const eventDoc = await getDoc(doc(db, "events", eventData.eventId));
          if (eventDoc.exists()) {
            const fullEvent = eventDoc.data();
            userCalendarEvents.push({
              id: eventData.eventId,
              ...fullEvent,
              addedAt: eventData.addedAt,
              type: "added", // Mark as added to calendar
            });
          }
        }

        console.log(`Loaded ${userCalendarEvents.length} calendar events`);
      } catch (error) {
        console.error("Error loading calendar events:", error);
      }
    }

    async function loadUserRegistrations() {
      const user = getCurrentUser();
      if (!user || !user.userId) return;

      try {
        const registrationsCol = collection(
          db,
          "users",
          user.userId,
          "registrations"
        );
        const snapshot = await getDocs(registrationsCol);

        userRegisteredEvents = [];
        for (const docSnap of snapshot.docs) {
          const registrationData = docSnap.data();
          // Get the full event details from the events collection
          const eventDoc = await getDoc(
            doc(db, "events", registrationData.eventId)
          );
          if (eventDoc.exists()) {
            const fullEvent = eventDoc.data();
            userRegisteredEvents.push({
              id: registrationData.eventId,
              ...fullEvent,
              registeredAt: registrationData.registeredAt,
              type: "registered", // Mark as registered
            });
          }
        }

        console.log(
          `Loaded ${userRegisteredEvents.length} registered events`
        );
      } catch (error) {
        console.error("Error loading registrations:", error);
      }
    }

    function setupCalendarWithEvents() {
      // Combine all events and organize by date
      const allEvents = [...userCalendarEvents, ...userRegisteredEvents];
      const eventDates = {};

      // Only process events that the user has registered for or added to calendar
      allEvents.forEach((event) => {
        if (event.start_time) {
          const dateStr = event.start_time
            .toDate()
            .toISOString()
            .split("T")[0];
          if (!eventDates[dateStr]) {
            eventDates[dateStr] = [];
          }
          eventDates[dateStr].push(event);
        }
      });

      // Sort events by start time for each date (nearest first)
      Object.keys(eventDates).forEach((dateStr) => {
        eventDates[dateStr].sort((a, b) => {
          return a.start_time.toDate() - b.start_time.toDate();
        });
      });

      console.log("User's event dates mapping:", eventDates);

      // Desktop calendar
      const desktopCalendar = flatpickr("#calendar", {
        inline: true,
        enableTime: false,
        dateFormat: "Y-m-d",
        onChange: function (selectedDates, dateStr) {
          selectedDate = dateStr;
          updateCalendarDisplay(dateStr, eventDates[dateStr] || []);
        },
        onDayCreate: function (dObj, dStr, fp, dayElem) {
          // Add custom styling for days with events
          const dateStr = dayElem.dateObj.toISOString().split("T")[0];
          if (eventDates[dateStr] && eventDates[dateStr].length > 0) {
            const events = eventDates[dateStr];
            const hasRegistered = events.some((e) => e.type === "registered");
            const hasAdded = events.some((e) => e.type === "added");

            console.log(
              `Date ${dateStr}: hasRegistered=${hasRegistered}, hasAdded=${hasAdded}`
            );

            if (hasRegistered) {
              // Solid orange for registered events
              dayElem.classList.add("has-registered-events");
              dayElem.style.backgroundColor = "#f59275";
              dayElem.style.color = "white";
              dayElem.style.fontWeight = "bold";
              dayElem.style.borderRadius = "50%";
              console.log(`Applied registered styling to ${dateStr}`);
            } else if (hasAdded) {
              // Orange outline for added events
              dayElem.classList.add("has-added-events");
              dayElem.style.backgroundColor = "transparent";
              dayElem.style.color = "#f59275";
              dayElem.style.fontWeight = "bold";
              dayElem.style.border = "2px solid #f59275";
              dayElem.style.borderRadius = "50%";
              console.log(`Applied added styling to ${dateStr}`);
            }
          }
        },
      });

      // Mobile calendar input
      const mobileCalendar = flatpickr("#calendar-mobile", {
        dateFormat: "Y-m-d",
        onChange: function (selectedDates, dateStr) {
          selectedDate = dateStr;
          updateCalendarDisplay(dateStr, eventDates[dateStr] || []);
        },
      });

      // Show today's events by default
      const today = new Date().toISOString().split("T")[0];
      if (eventDates[today] && eventDates[today].length > 0) {
        updateCalendarDisplay(today, eventDates[today]);
      } else {
        updateCalendarDisplay(today, []);
      }
    }

    function updateCalendarDisplay(dateStr, events) {
      const cardWrapper = document.getElementById("calendar-event-card-wrapper");

      if (!cardWrapper) {
        console.error("Calendar event card wrapper element not found");
        return;
      }

      cardWrapper.innerHTML = ""; // Clear old content

      if (events.length === 0) {
        const noEventsMsg = document.createElement("p");
        noEventsMsg.textContent = "No events on this day...";
        noEventsMsg.className =
          "text-gray-400 text-center text-lg italic fade-in";
        cardWrapper.appendChild(noEventsMsg);
      } else {
        const event = events[0];

        // Card container
        const card = document.createElement("div");
        card.className = "max-w-4xl bg-gray-900 overflow-hidden text-white items-center flex flex-col-reverse md:flex-row";

        // Left: Event Image
        const img = document.createElement("img");
        img.src =
          event.image_url ||
          "https://via.placeholder.com/600x400?text=Events+on+" +
          encodeURIComponent(dateStr);
        img.alt = event.name || "Event Image";
        img.className = "w-full md:w-1/2 rounded-xl h-48 sm:h-60 md:h-80 object-cover";

        // Right: Details
        const details = document.createElement("div");
        details.className =
          "p-4 sm:p-5 md:p-6 flex flex-col justify-between w-full md:w-1/2";

        // Top content container
        const contentTop = document.createElement("div");

        // Responsive event name
        const name = document.createElement("h3");
        name.textContent = event.name || "Unnamed Event";
        name.className = "text-lg sm:text-xl md:text-2xl font-semibold mb-2 sm:mb-3 truncate";

        // Responsive description (3 lines max)
        const description = document.createElement("p");
        description.textContent = event.description
          ? event.description
          : "No description";
        description.className =
          "text-gray-300 mb-3 sm:mb-4 text-sm sm:text-base leading-relaxed line-clamp-3";

        // Location with icon
        const location = document.createElement("p");
        location.innerHTML = `<i class="fas fa-map-marker-alt mr-2 text-gray-200"></i>${event.location || "No location specified"}`;
        location.className = "text-gray-400 text-sm sm:text-base mb-1 flex items-center";

        // Append top content
        contentTop.appendChild(name);
        contentTop.appendChild(description);
        contentTop.appendChild(location);

        // Bottom: View Event button
        const buttonContainer = document.createElement("div");
        buttonContainer.className = "flex justify-end mt-4";

        const viewBtn = document.createElement("a");
        viewBtn.href = `post-event-details.html?id=${event.id}`;
        viewBtn.textContent = "View Event";
        viewBtn.className =
          "inline-block px-4 py-2 text-sm sm:text-base bg-gradient-to-r to-[#f59275] from-[#f1647a] font-semibold text-white bg-gradient-to-r from-pink-500 via-red-500 to-yellow-500 rounded-xl shadow-md hover:opacity-90 transition";

        buttonContainer.appendChild(viewBtn);

        // Combine content
        details.appendChild(contentTop);
        details.appendChild(buttonContainer);

        // Build the card
        card.appendChild(img);
        card.appendChild(details);

        // Add to DOM
        cardWrapper.appendChild(card);
      }
    }

    // Function to register for an event
    async function registerForEvent(eventId) {
      const user = getCurrentUser();
      if (!user || !user.userId) {
        alert("Please sign in to register for events.");
        return;
      }

      try {
        // Register in both collections
        const registrationRef = doc(
          db,
          "users",
          user.userId,
          "registrations",
          eventId
        );
        await setDoc(registrationRef, {
          eventId,
          registeredAt: new Date(),
        });

        // Also register in the event's attendees collection
        const eventDoc = await getDoc(doc(db, "events", eventId));
        if (eventDoc.exists()) {
          const eventData = eventDoc.data();
          const attendeeRef = doc(
            db,
            "events",
            eventId,
            "attendees",
            user.userId
          );
          await setDoc(attendeeRef, {
            userId: user.userId,
            userName: user.email?.split("@")[0] || user.userId,
            userEmail: user.email,
            registeredAt: new Date(),
          });
        }

        alert("Successfully registered for the event!");
        // Reload the calendar to update the display
        await initializeCalendar();
      } catch (error) {
        console.error("Error registering for event:", error);
        alert("Failed to register for event. Please try again.");
      }
    }

    // Function to remove event from calendar
    async function removeFromCalendar(eventId) {
      const user = getCurrentUser();
      if (!user || !user.userId) {
        alert("Please sign in to manage your calendar.");
        return;
      }

      try {
        const calendarRef = doc(
          db,
          "users",
          user.userId,
          "calendar",
          eventId
        );
        await deleteDoc(calendarRef);

        alert("Event removed from calendar!");
        // Reload the calendar to update the display
        await initializeCalendar();
      } catch (error) {
        console.error("Error removing event from calendar:", error);
        alert("Failed to remove event from calendar. Please try again.");
      }
    }

    async function loadSuggestedCalendars() {
      const scrollCards = document.getElementById("scroll-cards");
      if (!scrollCards) return;

      try {
        const eventsCol = collection(db, "events");
        const snapshot = await getDocs(eventsCol);

        const creators = new Map();
        snapshot.forEach((doc) => {
          const event = doc.data();
          if (event.host_user_id && event.user?.username) {
            if (!creators.has(event.host_user_id)) {
              creators.set(event.host_user_id, {
                userId: event.host_user_id,
                username: event.user.username,
                profileImg: event.user.profileImg,
                bio: event.user.bio,
                eventCount: 0,
              });
            }
            creators.get(event.host_user_id).eventCount++;
          }
        });

        scrollCards.innerHTML = "";

        Array.from(creators.values())
          .slice(0, 5)
          .forEach((creator) => {
            const card = document.createElement("div");

            card.className = `bg-[#262C3D] rounded-2xl shadow-md shadow-gray-500/20
            p-3 border border-[#3a3e4a] transition duration-200
            cursor-pointer flex flex-row items-center
            lg:w-[32%] min-w-[380px] mr-3`;


            card.innerHTML = `
          <img src="${creator.profileImg || `https://ui-avatars.com/api/?name=${encodeURIComponent(creator.username)}&background=random&size=128&color=fff`}" 
              alt="${creator.username}" 
              class="w-24 h-24 sm:w-28 sm:h-28 object-cover rounded-lg sm:mr-4" />

          <div class="flex flex-col justify-between flex-1 min-w-0 h-full p-3">
            <div>
              <h3 class="text-base font-semibold mb-1 text-gray-100 truncate">
                ${creator.username}'s Calendar
              </h3>
              <p class="text-gray-400 text-sm truncate">
                ${creator.bio || `${creator.username} is an active event creator.`}
              </p>
            </div>
            <div class="flex items-center justify-between mt-4">
              <span class="flex items-center text-gray-400 text-xs">
                <i class="fa-solid fa-calendar mr-1"></i>
                ${creator.eventCount} events
              </span>
              <button onclick="window.location.href='user-events.html?id=${creator.userId}'"
                      style="box-shadow: -3px -3px 8px -3px rgba(255, 255, 255, 0.8);"
                      class="border border-gray-700 text-xs rounded-full px-4 py-1 bg-[#2F364A] text-gray-300 font-medium cursor-pointer hover:bg-[#3A4258] transition-colors">
                View Calendar
              </button>
            </div>
          </div>
        `;

            scrollCards.appendChild(card);
          });
      } catch (error) {
        console.error("Error loading suggested calendars:", error);
      }
    }


    async function loadSubscribedCalendars() {
      const user = getCurrentUser();
      const container = document.getElementById("subscribedCalendarsGrid");
      if (!container) return;

      container.innerHTML = "";

      if (!user || !user.userId) {
        container.innerHTML = `<p class='text-gray-500 text-center'>Sign in to see your subscribed calendars.</p>`;
        return;
      }

      try {
        // Fetch user's subscriptions
        const subscriptionsCol = collection(
          db,
          "users",
          user.userId,
          "creatorSubscriptions"
        );
        const subscriptionsSnap = await getDocs(subscriptionsCol);

        if (subscriptionsSnap.empty) {
          container.innerHTML = `<p class='text-gray-500 text-center'>You haven't subscribed to any calendars yet. Subscribe to event creators to see them here!</p>`;
          return;
        }

        // Process each subscription
        for (const docSnap of subscriptionsSnap.docs) {
          const subscriptionData = docSnap.data();
          const subscribedUserId = subscriptionData.subscribedToUserId;
          const subscribedUsername = subscriptionData.subscribedToUsername;

          // Get the subscribed user's profile info
          let profileImg = `https://ui-avatars.com/api/?name=${encodeURIComponent(
            subscribedUsername
          )}&background=random&size=128&color=fff`;
          let bio = `${subscribedUsername} is an event creator you're subscribed to.`;

          // Try to get user profile from users collection
          try {
            const userDoc = await getDoc(doc(db, "users", subscribedUserId));
            if (userDoc.exists()) {
              const userData = userDoc.data();
              if (userData.profileImg) {
                profileImg = userData.profileImg;
              }
              if (userData.bio) {
                bio = userData.bio;
              }
            }
          } catch (error) {
            console.log(
              "Could not fetch user profile for:",
              subscribedUserId
            );
          }

          // Create subscription card matching the design
          const card = document.createElement("div");
          card.className =
            "bg-[#262C3D] rounded-2xl shadow-md shadow-gray-500/20 overflow-hidden border border-[#3a3e4a]";
          card.innerHTML = `
              <div class="p-4">
                <div class="flex items-start gap-4 mb-4">
                  <img src="${profileImg}" alt="${subscribedUsername}" class="w-16 h-16 object-cover rounded-lg flex-shrink-0" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(
            subscribedUsername
          )}&background=random&size=128&color=fff'" />
                  <div class="flex-1 min-w-0">
                    <h3 class="text-lg font-semibold text-gray-200 mb-1">${subscribedUsername}'s Calendar</h3>
                    <p class="text-gray-400 text-sm line-clamp-2 mb-2">${bio}</p>
                  </div>
                </div>
                <div class="flex justify-between items-center">
                  <button onclick="window.location.href='user-events.html?id=${subscribedUserId}'"
                    style="box-shadow: -3px -3px 8px -3px rgba(255, 255, 255, 0.8);"
                    class="border border-gray-700 text-xs rounded-full px-4 py-1 bg-[#2F364A] text-gray-300 font-medium cursor-pointer hover:bg-[#3A4258] transition-colors">
                    View Calendar
                  </button>
                </div>
              </div>
            `;

          container.appendChild(card);
        }
      } catch (error) {
        console.error("Error loading subscribed calendars:", error);
        container.innerHTML = `<p class='text-gray-500 text-center'>Error loading subscribed calendars. Please try again.</p>`;
      }
    }

    // Function to unsubscribe from a creator
    async function unsubscribeFromCreator(userId, username) {
      const user = getCurrentUser();
      if (!user || !user.userId) {
        alert("Please sign in to manage subscriptions.");
        return;
      }

      if (
        !confirm(`Are you sure you want to unsubscribe from ${username}?`)
      ) {
        return;
      }

      try {
        // Remove from user's subscriptions
        const subscriptionsRef = collection(
          db,
          "users",
          user.userId,
          "creatorSubscriptions"
        );
        const q = query(
          subscriptionsRef,
          where("subscribedToUserId", "==", userId)
        );
        const existingSubs = await getDocs(q);

        for (const docSnap of existingSubs.docs) {
          await deleteDoc(docSnap.ref);
        }

        // Remove from creator's subscribers
        const creatorSubscribersRef = collection(
          db,
          "users",
          userId,
          "subscribers"
        );
        const subscriberQuery = query(
          creatorSubscribersRef,
          where("subscriberUserId", "==", user.userId)
        );
        const existingSubscribers = await getDocs(subscriberQuery);

        for (const docSnap of existingSubscribers.docs) {
          await deleteDoc(docSnap.ref);
        }

        alert(`Successfully unsubscribed from ${username}!`);

        // Reload the subscribed calendars
        await loadSubscribedCalendars();
      } catch (error) {
        console.error("Error unsubscribing:", error);
        alert("Failed to unsubscribe. Please try again.");
      }
    }

    function setupEmptyCalendar() {
      // Empty calendar with no events
      const updateImage = (dateStr) => {
        const img = document.getElementById("calendar-image");
        img.src =
          "https://via.placeholder.com/600x400?text=No+Events+on+" + dateStr;
      };

      // Desktop calendar
      flatpickr("#calendar", {
        inline: true,
        onChange: function (selectedDates, dateStr) {
          updateImage(dateStr);
          updateCalendarDisplay(dateStr, []);
        },
      });

      // Mobile calendar input
      flatpickr("#calendar-mobile", {
        dateFormat: "Y-m-d",
        onChange: function (selectedDates, dateStr) {
          updateImage(dateStr);
          updateCalendarDisplay(dateStr, []);
        },
      });

      // Show today's empty state by default
      const today = new Date().toISOString().split("T")[0];
      updateImage(today);
      updateCalendarDisplay(today, []);
    }
  </script>

      autoScroll: true,
      autoScrollInterval: 2000, // every 2s
      initialScrollDelay: 1,  // start scroll quickly
      autoScrollPauseOnHover: true,
    });
  </script>
