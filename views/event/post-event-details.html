<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Luma | Event</title>

    <!-- Tailwind CSS -->
    <link href="../../src/output.css" rel="stylesheet" />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>

  <body class="bg-[#0F111C] text-white">
    <!-- Sidebar -->
    <div data-component="sidebar"></div>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col min-h-screen ml-20">
      <main class="flex-1 p-4 md:p-10">
        <!-- Event Details Section (unchanged) -->
        <section class="mb-[90px]">
          <div class="flex gap-10 mb-16">
            <div class="w-[40%] flex justify-center items-start">
              <img
                id="eventImage"
                src=""
                alt="Card Image"
                class="w-full max-w-[649px] aspect-square object-contain rounded-4xl"
              />
            </div>
            <div class="w-[60%] flex flex-col justify-evenly px-2">
              <h1
                id="eventName"
                class="text-2xl md:text-3xl lg:text-4xl xl:text-5xl font-bold text-white leading-tight mb-1"
              ></h1>
              <div class="flex flex-col gap-2">
                <div id="eventStartTime"></div>
                <div id="eventEndTime"></div>
                <div id="eventLocation"></div>
              </div>
              <div class="flex flex-col gap-2">
                <span class="text-white text-lg font-semibold">Capacity:</span>
                <span class="text-base text-white" id="eventCapacity"></span>
              </div>
            </div>
          </div>
        </section>

        <!-- About Section (unchanged) -->
        <section class="mb-[90px]">
          <div class="flex gap-10 mb-16">
            <div class="w-[40%] flex flex-col justify-start gap-6">
              <div class="flex flex-col">
                <span class="text-gray-500 text-lg font-semibold"
                  >Hosted by</span
                >
                <span class="text-base text-[#5E5E5E]" id="eventHost"></span>
              </div>
              <div class="flex flex-col">
                <span class="text-gray-500 text-lg font-semibold"
                  >36 people are going</span
                >
                <span class="text-base text-[#5E5E5E]"
                  >Valentina, Amandeep and 34 others</span
                >
              </div>
              <div class="flex flex-col mb-5">
                <span class="text-base text-[#5E5E5E]">Contact the host</span>
                <span class="text-base text-[#5E5E5E]">Report the event</span>
              </div>
              <div class="w-full">
                <img
                  src="../../src/asset/images/map.png"
                  alt="Card Image"
                  class="w-full h-64 md:h-80 lg:h-96 object-cover rounded-4xl border border-gray-500"
                />
              </div>
            </div>
            <div class="w-[60%] flex flex-col px-2">
              <h1 class="text-2xl font-bold text-white leading-tight mb-3">
                About Event
              </h1>
              <div class="flex flex-col gap-2">
                <p
                  class="text-base text-white leading-relaxed"
                  id="eventDescription"
                ></p>
              </div>
            </div>
          </div>
        </section>

        <!-- Comments Section -->
        <section>
          <div class="max-w-7xl mx-auto">
            <h2
              class="text-[40px] font-extrabold text-center mb-10"
              style="
                background: linear-gradient(
                  269deg,
                  #f59275 24.95%,
                  #f1647a 87.01%
                );
                background-clip: text;
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
              "
            >
              Comments
            </h2>

            <!-- Shared grid: comment input + comments -->
            <div
              id="commentGrid"
              class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"
            >
              <!-- Comment Input -->
              <div
                class="bg-gradient-to-b from-[#F59275] to-[#F1647A] p-[3px] rounded-2xl h-full"
              >
                <div
                  class="bg-[#1A1A2E] rounded-[16px] p-5 h-full flex flex-col justify-between"
                >
                  <textarea
                    id="commentInput"
                    placeholder="I'm really looking forward to the community aspect of this event!
There's nothing better than sharing Lovecraft's chilling tales with fellow fans."
                    class="bg-[#2E2E48] text-white rounded-lg p-4 resize-none h-48 focus:outline-none mb-4"
                  ></textarea>
                  <button
                    id="postCommentBtn"
                    class="bg-gradient-to-r from-[#FF8E53] to-[#FE6B8B] text-white font-semibold px-6 py-3 rounded-full shadow-md"
                  >
                    Comment
                  </button>
                </div>
              </div>
            </div>
          </div>
        </section>
      </main>

      <!-- Footer -->
      <div data-component="footer"></div>
    </div>

    <!-- Scripts -->
    <script src="../../js/inject.js" defer></script>
    <script src="../../js/main.js" defer></script>
    <script src="../../js/hero-carousel.js" defer></script>
    <script type="module" src="../../js/postEventDetails.js"></script>
  </body>
</html>
