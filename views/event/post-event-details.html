<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luma | Event Details</title>
    <link href="../../src/output.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
</head>

<body class="bg-[#1A1F2C] font-nunito text-white min-h-screen">
    <div data-component="sidebar"></div>

    <div class="flex-1 flex flex-col min-h-screen md:ml-[90px] pt-10">

        <main class="flex-1 p-4 md:py-10 md:px-20">
            <!-- Event Header: Image + Info -->
            <div class="flex flex-col lg:flex-row gap-8 items-start mb-12">
                <!-- Event Image -->
                <div class="relative w-full lg:w-1/2 aspect-square rounded-4xl overflow-hidden cursor-pointer">
                    <div id="imageLoadingText"
                        class="absolute inset-0 flex items-center justify-center bg-[#1A1F2C] text-gray-400 text-xl z-10">
                        Loading image...
                    </div>
                    <img id="eventImage" class="w-full h-full object-cover rounded-4xl" src="" alt="Event Image" />
                </div>

                <!-- Event Info -->
                <div class="w-full lg:w-1/2 flex flex-col gap-6">
                    <h3 id="eventName" class="font-extrabold text-[42px] luma-gradient text-white">
                        Loading...
                    </h3>
                    <div class="gap-6">
                        <div class="flex flex-col gap-5">
                            <div id="eventStartTime"></div>
                            <div id="eventEndTime"></div>
                            <div id="eventLocation"></div>
                            <div>
                                <span class="text-white text-lg font-semibold">
                                    Capacity:
                                    <span class="text-base text-white" id="eventCapacity">Processing...</span>
                                </span>
                            </div>
                            <div class="flex flex-col">
                                <span class="text-gray-200 text-lg font-semibold" id="eventGoingCount">0 people are
                                    going</span>
                                <span class="text-base text-gray-400" id="eventGoingList">Processing...</span>
                            </div>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="flex gap-4 flex-wrap mt-5">
                        <button id="event-register-btn" style="box-shadow: -3px -3px 8px -3px rgba(255, 255, 255, 0.8)"
                            class="border border-gray-700 rounded-xl px-6 py-2 bg-[#2F364A] text-gray-200 cursor-pointer hover:bg-[#3A4258] transition-colors">
                            Register
                        </button>
                        <button style="box-shadow: -3px -3px 8px -3px rgba(255, 255, 255, 0.8)"
                            class="border border-gray-700 rounded-xl px-6 py-2 bg-[#2F364A] text-gray-200 cursor-pointer hover:bg-[#3A4258] transition-colors">
                            Share
                        </button>
                        <button id="add-to-calendar-btn" style="box-shadow: -3px -3px 8px -3px rgba(255, 255, 255, 0.8)"
                            class="border border-gray-700 rounded-xl px-6 py-2 bg-[#2F364A] text-gray-200 cursor-pointer hover:bg-[#3A4258] transition-colors">
                            Add to Calendar
                        </button>
                    </div>
                </div>
            </div>


            <!-- Description -->
            <div class="py-5 px-2 md:px-10">
                <div class="about-game flex flex-col lg:flex-row gap-8 md:p-8 items-start mb-10">
                    <!-- Left Column -->
                    <div class="flex flex-col gap-6 w-full lg:w-1/2 text-white">
                        <!-- <div>
                            <h3 class="text-xl font-semibold font-sans text-white">Hosted By</h3>
                            <div id="eventHost" class="text-white text-2xl">Loading...</div>
                        </div> -->
                        <div class="w-full">
                            <div id="eventMap"
                                class="w-full h-64 md:h-80 lg:h-96 rounded-4xl border border-gray-500 overflow-hidden"
                                style="height: 350px;">
                                <!-- Map will be loaded here dynamically -->
                            </div>
                        </div>
                    </div>

                    <!-- Right Column -->
                    <div class="flex flex-col gap-6 w-full lg:w-1/2 text-white">
                        <h2 class="text-2xl font-extrabold luma-gradient">About Event</h2>
                        <p id="eventDescription" class="text-gray-400">
                            Loading detailed event description...
                        </p>
                    </div>
                </div>
                <!-- Comments Section -->
                <div class="comments p-4 text-white">
                    <h1 class="text-[40px] font-extrabold text-center mb-10 luma-gradient">
                        Comments
                    </h1>

                    <div class="max-w-7xl mx-auto">
                        <div id="commentGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                            <div class="bg-gradient-to-b to-[#F59275] from-[#F1647A] p-[3px] rounded-2xl h-full">
                                <div class="rounded-[16px] p-5 h-full flex flex-col justify-between">
                                    <textarea id="commentInput" style="
                                        box-shadow: inset 0px 0px 18px -5px rgb(77 77 77 / 80%);
                                        " placeholder="Enter your comment..."
                                        class="bg-[#FFC4C5] placeholder:text-gray-500 text-gray-700 rounded-lg p-4 resize-none h-48 focus:outline-none mb-4"></textarea>
                                    <button id="postCommentBtn" style="box-shadow: 0px 0px 7px 0px rgb(77 77 77 / 80%)"
                                        class="text-white bg-gradient-to-b from-[#F59275] to-[#F1647A]
                                        hover:from-[#F1647A] hover:to-[#F59275]
                                        hover:shadow-xl hover:-translate-y-1.5
                                        transition-all duration-300 ease-in-out
                                        font-semibold px-6 py-3 rounded-2xl shadow-md
                                        cursor-pointer">
                                        Add Comment
                                    </button>
                                </div>
                            </div>
                            <!-- Dynamic comments will be rendered here by JS -->
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <div data-component="footer"></div>

    <!--Script-->
    <script src="../../service/gameService.js" defer></script>
    <script src="../../js/inject.js" defer></script>
    <script src="../../js/hero-carousel.js" defer></script>
    <script type="module" src="../../js/auth/signout.js"></script>
    <script type="module" src="../../js/postEventDetails.js"></script>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <!-- Authentication Guard -->
    <script type="module">
        import { initAuthGuard } from "../../js/auth/authGuard.js";
        initAuthGuard();
    </script>
</body>

</html>
