<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Luma | Home</title>

    <!-- Tailwind CSS -->
    <link href="../../src/output.css" rel="stylesheet" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>

<body class="bg-gray-100">
    <!-- Sidebar -->
    <div data-component="sidebar"></div>

    <!-- Header with Navbar and Hero -->
    <header class="relative bg-white">
        <!-- <div data-component="navbar"></div> -->
    </header>

    <div class="flex-1 flex flex-col min-h-screen ml-[90px]">

        <!-- Main Content -->
        <main class="flex-1 p-4 md:p-20">
            <div class="flex-1 flex flex-col min-h-screen">
                <div class="flex gap-10 mb-16 items-stretch">
                    <div class="w-[50%] flex justify-center items-center">
                        <!-- Wrapper to enforce shape -->
                        <div class="w-full max-w-[649px] aspect-square rounded-4xl overflow-hidden cursor-pointer">
                            <img id="imagePreview" src="../../src/asset/images/event-img.png" alt="Card Image"
                                class="w-full h-full object-cover" />
                        </div>

                        <!-- Hidden file input -->
                        <input type="file" id="eventImage" accept="image/*" class="hidden" />


                    </div>
                    <div class="w-[50%] flex flex-col justify-evenly px-2 gap-3">
                        <!-- Event Name -->
                        <input id="eventName" type="text" placeholder="Enter event name" style="caret-color: #e9e9e9;"
                            class="block w-full text-gray-400 text-4xl leading-tight placeholder:text-4xl placeholder:font-bold px-4 pb-6 focus:outline-none focus:bg-none" />

                        <div class="flex flex-col gap-3">
                            <div class="flex items-stretch gap-4">
                                <div class="w-[70%] border border-opacity-50 py-3 rounded-xl flex items-center justify-center bg-transparent"
                                    style="box-shadow: 0 0 8px 0px rgba(255, 255, 255, 0.8);">
                                    <div class="flex flex-col gap-2 px-5 w-full">
                                        <div class="flex flex-row w-full gap-2">
                                            <!-- label 30% -->
                                            <label
                                                class="w-[30%] flex items-center text-gray-400 font-semibold">Start</label>
                                            <!-- input field with placeholder and border with border radius. 40% -->
                                            <input id="startDate"
                                                class="w-[40%] border border-gray-300 bg-gray-200 rounded-full px-3 focus:outline-none focus:border-gray-500"
                                                type="date" placeholder="Select date" />
                                            <!-- input field with placeholder and border with border radius. 30% -->
                                            <input id="startTime"
                                                class="w-[30%] border border-gray-300 bg-gray-200 rounded-full px-3 focus:outline-none focus:border-gray-500"
                                                type="time" placeholder="Select time" />
                                        </div>
                                        <div class="flex flex-row w-full gap-2">
                                            <!-- label 30% -->
                                            <label
                                                class="w-[30%] flex items-center text-gray-400 font-semibold">End</label>
                                            <!-- input field with placeholder and border with border radius. 40% -->
                                            <input id="endDate"
                                                class="w-[40%] border border-gray-300 bg-gray-200 rounded-full px-3 focus:outline-none focus:border-gray-500"
                                                type="date" placeholder="Select date" />
                                            <!-- input field with placeholder and border with border radius. 30% -->
                                            <input id="endTime"
                                                class="w-[30%] border border-gray-300 bg-gray-200 rounded-full px-3 focus:outline-none focus:border-gray-500"
                                                type="time" placeholder="Select time" />
                                        </div>
                                    </div>
                                </div>

                                <div style="box-shadow: 0 0 8px 0px rgba(255, 255, 255, 0.8);"
                                    class="w-[30%] border border-opacity-50 rounded-xl flex items-center justify-center bg-transparent py-3">
                                </div>
                            </div>
                        </div>
                        <div style="box-shadow: 0 0 8px 0px rgba(255, 255, 255, 0.8);"
                            class="flex items-center overflow-hidden border border-opacity-50 py-3 rounded-xl p-3 gap-3">
                            <i class="fas fa-map-marker-alt text-2xl text-gray-200"></i>
                            <!-- Location -->
                            <div class="flex flex-col gap-2">
                                <label class="text-gray-400 font-semibold ml-4">Add event location
                                    <span class="text-xs text-gray-500 font-medium">( Offline location or a virtual link
                                        )</span>
                                </label>
                            </div>
                        </div>
                        <div style="box-shadow: 0 0 8px 0px rgba(255, 255, 255, 0.8);"
                            class="flex items-center overflow-hidden border-0 rounded-xl p-3">
                            <i class="fas fa-file-alt text-2xl text-gray-200"></i>
                            <!-- Description -->
                            <textarea id="eventDescription" style="caret-color: #e9e9e9;" rows="1" placeholder="Add description"
                                class="w-full px-4 py-3 ml-4 rounded-lg placeholder-gray-400"></textarea>
                        </div>
                        <div style="box-shadow: 0 0 8px 0px rgba(255, 255, 255, 0.8);"
                            class="flex items-center overflow-hidden py-3 rounded-xl p-3">
                            <i class="fas fa-user-friends text-lg text-gray-200"></i>
                            <!-- Capacity -->
                            <input id="eventCapacity" style="caret-color: #e9e9e9;" type="number" placeholder="Capacity"
                                class="w-full px-4 py-3 ml-4 rounded-lg placeholder-gray-400" />
                        </div>
                        <div class="flex gap-3">
                            <button
                                class="mt-3 w-full bg-gray-600 hover:bg-gray-700 text-gray-300 font-medium py-4 rounded-xl text-lg transition-colors duration-200">
                                Save as a draft
                            </button>

                            <button id="createEventBtn"
                                class="mt-3 w-full luma-gradient-bg overlay-gradient hover:bg-gray-700 text-white font-bold py-4 rounded-xl text-lg transition-colors duration-200">
                                Create Event
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <!-- Footer -->
        <div data-component="footer"></div>
    </div>
    </div>


    <!-- Scripts -->
    <script src="../../js/inject.js" defer></script>
    <script src="../../js/main.js" defer></script>
    <script src="../../js/hero-carousel.js" defer></script>


    <!-- Load JS module -->
    <script type="module" src="../../js/handleCreateEvent.js"></script>
</body>

</html>
