<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Luma | Home</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="shortcut icon" href="/src/asset/images/Luma - Icon 1.png" />

  <style type="text/tailwindcss">
    .scroll-container::-webkit-scrollbar {
        display: none;
      }

      .scroll-container {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      body {
        background: var(--background-color, #1a1f2c);
      }

      .luma-gradient {
        background: linear-gradient(269deg, #f59275 24.95%, #f1647a 87.01%);
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .sidebar-shadow {
        box-shadow: 3.276px 6.427px 6.049px 0px rgba(0, 5, 16, 0.7),
          -3.276px -6.427px 6.049px 0px rgba(46, 51, 62, 0.7);
      }

      .luma-gradient-bg {
        background: linear-gradient(269deg, #f59275 24.95%, #f1647a 87.01%);
      }

      .tag {
        background-color: #334155;
        color: #f1f5f9;
        padding: 0.25rem 0.75rem;
        border-radius: 9999px;
        margin-right: 0.5rem;
        margin-bottom: 0.5rem;
        font-size: 0.875rem;
        display: inline-flex;
        align-items: center;
      }

      .tag button {
        margin-left: 0.5rem;
        background: none;
        border: none;
        color: #f1f5f9;
        font-weight: bold;
        cursor: pointer;
      }

      .radio-group input[type="radio"] {
        appearance: none;
        width: 16px;
        height: 16px;
        border: 2px solid #e5e7eb;
        border-radius: 9999px;
        outline: none;
        cursor: pointer;
        position: relative;
      }

      .radio-group input[type="radio"]:checked::before {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 8px;
        height: 8px;
        background-color: white;
        border-radius: 9999px;
      }
    </style>

  <!-- Google Fonts - Nunito -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@200;300;400;500;600;700;800;900&display=swap"
    rel="stylesheet" />

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>

<body>
  <div data-component="mobilenavbar"></div>
  <div data-component="sidebar"></div>
  <header class="relative bg-white"></header>

  <div class="flex-1 flex flex-col min-h-screen ml-[90px]">
    <main class="flex-1 p-4 md:p-20">
      <div clas s="flex-1 flex flex-col min-h-screen">
        <div class="flex gap-10 mb-16 items-stretch">
          <!-- Image preview and file upload -->
          <div class="w-[50%] flex justify-center items-center">
            <div class="w-full max-w-[649px] aspect-square rounded-4xl overflow-hidden cursor-pointer">
              <img id="imagePreview" src="../../src/asset/images/event-img.png" alt="Card Image"
                class="w-full h-full object-cover" />
            </div>
            <input type="file" id="eventImage" accept="image/*" class="hidden" />
          </div>

          <!-- Form inputs -->
          <div class="w-[50%] flex flex-col justify-evenly px-2 gap-3">
            <input id="eventName" type="text" placeholder="Enter event name" style="caret-color: #e9e9e9"
              autocomplete="off"
              class="block w-full text-white text-4xl leading-tight placeholder:text-4xl placeholder:font-bold placeholder-gray-400 px-4 pb-6 focus:outline-none focus:bg-none" />

            <div class="flex items-stretch gap-4">
              <!-- Date and time fields -->
              <div
                class="w-[70%] border border-opacity-50 py-3 rounded-xl flex items-center justify-center bg-transparent"
                style="box-shadow: 0 0 8px 0px rgba(255, 255, 255, 0.8)">
                <div class="flex flex-col gap-2 px-5 w-full">
                  <div class="flex flex-row w-full gap-2">
                    <label class="w-[30%] flex items-center text-gray-400 font-semibold">Start</label>
                    <input id="startDate" type="date"
                      class="w-[40%] border border-gray-300 bg-gray-200 rounded-full px-3 text-black placeholder-gray-400" />
                    <input id="startTime" type="time"
                      class="w-[30%] border border-gray-300 bg-gray-200 rounded-full px-3 text-black placeholder-gray-400" />
                  </div>
                  <div class="flex flex-row w-full gap-2">
                    <label class="w-[30%] flex items-center text-gray-400 font-semibold">End</label>
                    <input id="endDate" type="date"
                      class="w-[40%] border border-gray-300 bg-gray-200 rounded-full px-3 text-black placeholder-gray-400" />
                    <input id="endTime" type="time"
                      class="w-[30%] border border-gray-300 bg-gray-200 rounded-full px-3 text-black placeholder-gray-400" />
                  </div>
                </div>
              </div>

              <!-- Timezone display -->
              <div id="timezoneDisplay"
                class="w-[30%] flex flex-col justify-center items-start text-left px-5 rounded-xl py-3 text-gray-200"
                style="box-shadow: 0 0 8px 0px rgba(255, 255, 255, 0.8)">
                <div class="flex items-center gap-2">
                  <i class="fas fa-globe text-sm"></i>
                  <span class="text-sm font-medium">GMT</span>
                </div>
                <div class="text-sm mt-2">Timezone</div>
                <div class="text-sm">City</div>
              </div>
            </div>

            <!-- Recurrence radio group -->
            <div
              class="radio-group flex justify-between items-center gap-4 px-6 py-3 rounded-xl text-white font-medium bg-[#2c3244]"
              style="box-shadow: 0 0 8px 0px rgba(255, 255, 255, 0.8)">
              <label class="flex items-center gap-2"><input type="radio" name="recurrence" value="weekly" />
                Weekly</label>
              <label class="flex items-center gap-2"><input type="radio" name="recurrence" value="monthly" />
                Monthly</label>
              <label class="flex items-center gap-2"><input type="radio" name="recurrence" value="annually" />
                Annually</label>
              <label class="flex items-center gap-2"><input type="radio" name="recurrence" value="custom" />
                Custom</label>
            </div>

            <!-- Location -->
            <div style="box-shadow: 0 0 8px 0px rgba(255, 255, 255, 0.8)"
              class="flex items-center overflow-hidden border-0 rounded-xl p-3">
              <i class="fas fa-map-marker-alt text-2xl text-gray-200"></i>
              <input id="eventLocation" type="text" placeholder="Add event location (offline or virtual)"
                class="ml-4 w-full px-4 py-3 rounded-lg text-white placeholder-gray-400 bg-transparent" />
            </div>

            <!-- Description and Tags -->
            <div class="flex gap-3">
              <div class="w-1/2 flex items-center overflow-hidden border-0 rounded-xl p-3"
                style="box-shadow: 0 0 8px 0px rgba(255, 255, 255, 0.8)">
                <i class="fas fa-align-left text-2xl text-gray-200"></i>
                <input id="eventDescription" type="text" placeholder="Add Description" style="caret-color: #e9e9e9"
                  class="ml-4 w-full px-4 py-3 rounded-lg text-white placeholder-white bg-transparent" />
              </div>

              <div class="w-1/2 flex flex-col border-0 rounded-xl px-4 py-3"
                style="box-shadow: 0 0 8px 0px rgba(255, 255, 255, 0.8)">
                <label class="flex items-center gap-3 text-white font-semibold mb-2">
                  <i class="fas fa-align-left text-xl"></i> Add Tags
                </label>
                <div id="tagContainer" class="flex flex-wrap"></div>
                <input id="tagInput" type="text" placeholder="Type and press Enter"
                  class="mt-1 bg-transparent border-none outline-none text-white placeholder-gray-400" />
              </div>
            </div>

            <!-- Capacity -->
            <div style="box-shadow: 0 0 8px 0px rgba(255, 255, 255, 0.8)"
              class="flex items-center overflow-hidden py-3 rounded-xl p-3">
              <i class="fas fa-user-friends text-lg text-gray-200"></i>
              <input id="eventCapacity" type="number" placeholder="Capacity" style="caret-color: #e9e9e9"
                class="w-full px-4 py-3 ml-4 rounded-lg text-white placeholder-gray-400 bg-transparent" />
            </div>

            <!-- Submit -->
            <div class="flex gap-3">
              <!-- <button
                class="mt-3 w-full bg-gray-600 hover:bg-gray-700 text-gray-300 font-medium py-4 rounded-xl text-lg transition-colors duration-200">
                Save as a draft
              </button> -->
              <button id="createEventBtn"
                class="mt-3 w-full luma-gradient-bg overlay-gradient hover:bg-gray-700 text-white font-bold py-4 rounded-xl text-lg transition-colors duration-200">
                Create Event
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <div data-component="footer"></div>
  </div>

  <!-- App Scripts -->
  <script src="../../js/inject.js" defer></script>
  <script src="../../js/main.js" defer></script>
  <script src="../../js/hero-carousel.js" defer></script>
  <script type="module" src="../../js/handleCreateEvent.js"></script>
  <script type="module" src="../../js/auth/signout.js"></script>
  <script type="module" src="../../js/mobile-navbar.js"></script>

  <!-- Authentication Guard -->
  <script type="module">
    import { initAuthGuard } from "../../js/auth/authGuard.js";
    initAuthGuard();
  </script>
</body>

</html>
