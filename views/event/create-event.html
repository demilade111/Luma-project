                <div class="w-[60%] flex flex-col justify-evenly px-2 gap-3">
                    <!-- Event Name -->
                    <input id="eventName" type="text" placeholder="Enter event name" style="caret-color: #e9e9e9;"
                        class="block w-full text-gray-700 text-4xl leading-tight placeholder:text-4xl placeholder:text-[#BEBCBC] placeholder:font-bold px-4 py-6 focus:outline-none focus:bg-none" />

                    <div class="flex flex-col gap-3">
                        <div class="flex items-center gap-3">
                            <div
                                class="w-[70%] border border-gray-500 py-3 rounded-xl flex items-center justify-center bg-white h-24">
                                <div class="flex flex-col gap-2 px-5 w-full">
                                    <div class="flex flex-row w-full gap-2">
                                        <!-- label 20% -->
                                        <label
                                            class="w-[30%] flex items-center text-gray-500 font-semibold">Start</label>
                                        <!-- input field with placeholder and border with border radius. 40% -->
                                        <input id="startDate"
                                            class="w-[40%] border border-gray-300 rounded-full px-3 focus:outline-none focus:border-gray-500"
                                            type="date" placeholder="Select date" />
                                        <!-- input field with placeholder and border with border radius. 30% -->
                                        <input id="startTime"
                                            class="w-[30%] border border-gray-300 rounded-full px-3 focus:outline-none focus:border-gray-500"
                                            type="time" placeholder="Select time" />
                                    </div>
                                    <div class="flex flex-row w-full gap-2">
                                        <!-- label 20% -->
                                        <label class="w-[30%] flex items-center text-gray-500 font-semibold">End</label>
                                        <!-- input field with placeholder and border with border radius. 40% -->
                                        <input id="endDate"
                                            class="w-[40%] border border-gray-300 rounded-full px-3 focus:outline-none focus:border-gray-500"
                                            type="date" placeholder="Select date" />
                                        <!-- input field with placeholder and border with border radius. 30% -->
                                        <input id="endTime"
                                            class="w-[30%] border border-gray-300 rounded-full px-3 focus:outline-none focus:border-gray-500"
                                            type="time" placeholder="Select time" />
                                    </div>
                                </div>
                            </div>
                            <div
                                class="w-[30%] border border-gray-500 rounded-xl flex items-center justify-center bg-white h-24">
                            </div>
                        </div>
                    </div>
                    <div class="flex items-center overflow-hidden border border-gray-500 rounded-xl p-3 bg-white">
                        <div
                            class="border border-gray-500 w-12 h-12 bg-gray-100 rounded-xl flex items-center justify-center">
                            <!-- location icon -->
                            <i class="fas fa-map-marker-alt text-2xl text-gray-500"></i>
                        </div>
                        <!-- Location -->
                        <input id="eventLocation" type="text" placeholder="Event location or virtual link"
                            class="w-full px-4 py-3 ml-4 border rounded-lg bg-gray-100 placeholder-gray-400" />
                    </div>
                    <div class="flex items-center overflow-hidden border border-gray-500 rounded-xl p-3 bg-white">
                        <div
                            class="border border-gray-500 w-12 h-12 bg-gray-100 rounded-xl flex items-center justify-center">
                            <!-- description icon -->
                            <i class="fas fa-file-alt text-2xl text-gray-500"></i>
                        </div>
                        <!-- Description -->
                        <textarea id="eventDescription" rows="3" placeholder="Description"
                            class="w-full px-4 py-3 ml-4 border rounded-lg bg-gray-100 placeholder-gray-400"></textarea>
                    </div>
                    <div class="flex items-center overflow-hidden border border-gray-500 rounded-xl p-3 bg-white">
                        <div
                            class="border border-gray-500 w-12 h-12 bg-gray-100 rounded-xl flex items-center justify-center">
                            <!-- member icon -->
                            <i class="fas fa-user-friends text-2xl text-gray-500"></i>
                        </div>
                        <!-- Capacity -->
                        <input id="eventCapacity" type="number" placeholder="Capacity"
                            class="w-full px-4 py-3 ml-4 border rounded-lg bg-gray-100 placeholder-gray-400" />
                    </div>
                    <button id="createEventBtn"
                        class="mt-3 w-full bg-gray-600 hover:bg-gray-700 text-white font-bold py-4 rounded-xl text-lg transition-colors duration-200">
                        Create Event
                    </button>
                </div>
            </div>
        </div>
