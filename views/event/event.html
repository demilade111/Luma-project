<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="../../src/output.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <title>Luma | Events</title>
  <link rel="shortcut icon" href="/src/asset/images/Luma - Icon 1.png" />
</head>

<body class="bg-[#1A1F2C] font-nunito text-white min-h-screen">
  <div data-component="mobilenavbar"></div>
  <div data-component="sidebar"></div>

  <div class="flex-1 flex flex-col min-h-screen md:ml-[90px] pt-5">
    <main class="flex-1 p-4 md:py-10 md:px-20">
      <div class="px-2">
        <div class="flex justify-between items-center mb-5 md:mb-12">
          <h1
            class="font-bold mb-6 flex-shrink-0 font-nunito text-3xl sm:text-4xl md:text-5xl lg:text-6xl luma-gradient">
            Popular Events
          </h1>
        </div>
        <div id="popularEventsGrid" class="grid grid-cols-1 lg:grid-cols-2 gap-10 md:gap-6">
          <!-- JS will inject event cards here -->
          Processing the events...
        </div>
      </div>


      <div class="relative">
        <!-- Left Scroll Button -->
        <button id="scrollLeftCities"
          class="absolute -left-14 top-1/2 mt-12 w-12 h-12 -translate-y-1/2 z-30 bg-white/30 text-white p-2 rounded-full hidden md:block cursor-pointer hover:bg-white/20 transition-colors">
          <i class="fa-solid fa-angle-left"></i>
        </button>

        <!-- City Calendars Section -->
        <div class="mb-16 px-2 mt-24">
          <h1
            class="font-bold flex-shrink-0 font-nunito text-3xl sm:text-4xl md:text-5xl lg:text-6xl luma-gradient h-20 md:h-28">
            City Calendars
          </h1>

          <!-- Scrollable circles container -->
          <div id="scroll-cities-container"
            class="flex space-x-5 sm:space-x-28 overflow-x-auto pb-4 pl-0 pr-6 sm:px-10 scroll-hide">
            <!-- Vancouver -->
            <div class="flex flex-col items-center min-w-[96px] sm:min-w-[120px]" data-city="Vancouver">
              <div
                class="w-24 h-24 sm:w-48 sm:h-48 rounded-full border border-white shadow-[0_6px_12px_rgba(0,0,0,0.3)] overflow-hidden flex items-center justify-center relative city-image-container">
                <div
                  class="absolute inset-0 rounded-full shadow-[inset_0_4px_8px_rgba(255,255,255,0.9)] pointer-events-none z-10">
                </div>
                <img src="../../src/asset/images/vancouver.png" alt="Vancouver"
                  class="object-cover w-full h-full z-0 city-bg" />
                <div class="event-preview absolute left-0 right-0 bottom-2 z-20 flex flex-col items-center"></div>
                <span
                  class="absolute bottom-0 w-full text-center text-white text-xs sm:text-base font-semibold pb-4 pt-1 sm:pb-6 sm:pt-2 z-20 bg-gradient-to-t from-black/60 to-transparent city-name">Vancouver</span>
              </div>
            </div>

            <!-- Toronto -->
            <div class="flex flex-col items-center min-w-[96px] sm:min-w-[120px]" data-city="Toronto">
              <div
                class="w-24 h-24 sm:w-48 sm:h-48 rounded-full border border-white shadow-[0_6px_12px_rgba(0,0,0,0.3)] overflow-hidden flex items-center justify-center relative city-image-container">
                <div
                  class="absolute inset-0 rounded-full shadow-[inset_0_4px_8px_rgba(255,255,255,0.9)] pointer-events-none z-10">
                </div>
                <img src="../../src/asset/images/toronto.png" alt="Toronto"
                  class="object-cover w-full h-full z-0 city-bg" />
                <div class="event-preview absolute left-0 right-0 bottom-2 z-20 flex flex-col items-center"></div>
                <span
                  class="absolute bottom-0 w-full text-center text-white text-xs sm:text-base font-semibold pb-4 pt-1 sm:pb-6 sm:pt-2 z-20 bg-gradient-to-t from-black/60 to-transparent city-name">Toronto</span>
              </div>
            </div>

            <!-- Montreal -->
            <div class="flex flex-col items-center min-w-[96px] sm:min-w-[120px]" data-city="Montreal">
              <div
                class="w-24 h-24 sm:w-48 sm:h-48 rounded-full border border-white shadow-[0_6px_12px_rgba(0,0,0,0.3)] overflow-hidden flex items-center justify-center relative city-image-container">
                <div
                  class="absolute inset-0 rounded-full shadow-[inset_0_4px_8px_rgba(255,255,255,0.9)] pointer-events-none z-10">
                </div>
                <img src="../../src/asset/images/montreal.png" alt="Montreal"
                  class="object-cover w-full h-full z-0 city-bg" />
                <div class="event-preview absolute left-0 right-0 bottom-2 z-20 flex flex-col items-center"></div>
                <span
                  class="absolute bottom-0 w-full text-center text-white text-xs sm:text-base font-semibold pb-4 pt-1 sm:pb-6 sm:pt-2 z-20 bg-gradient-to-t from-black/60 to-transparent city-name">Montreal</span>
              </div>
            </div>

            <!-- Helsinki -->
            <div class="flex flex-col items-center min-w-[96px] sm:min-w-[120px]" data-city="Helsinki">
              <div
                class="w-24 h-24 sm:w-48 sm:h-48 rounded-full border border-white shadow-[0_6px_12px_rgba(0,0,0,0.3)] overflow-hidden flex items-center justify-center relative city-image-container">
                <div
                  class="absolute inset-0 rounded-full shadow-[inset_0_4px_8px_rgba(255,255,255,0.9)] pointer-events-none z-10">
                </div>
                <img src="../../src/asset/images/helsinki.png" alt="Helsinki"
                  class="object-cover w-full h-full z-0 city-bg" />
                <div class="event-preview absolute left-0 right-0 bottom-2 z-20 flex flex-col items-center"></div>
                <span
                  class="absolute bottom-0 w-full text-center text-white text-xs sm:text-base font-semibold pb-4 pt-1 sm:pb-6 sm:pt-2 z-20 bg-gradient-to-t from-black/60 to-transparent city-name">Helsinki</span>
              </div>
            </div>

            <!-- Seattle -->
            <div class="flex flex-col items-center min-w-[96px] sm:min-w-[120px]" data-city="Seattle">
              <div
                class="w-24 h-24 sm:w-48 sm:h-48 rounded-full border border-white shadow-[0_6px_12px_rgba(0,0,0,0.3)] overflow-hidden flex items-center justify-center relative city-image-container">
                <div
                  class="absolute inset-0 rounded-full shadow-[inset_0_4px_8px_rgba(255,255,255,0.9)] pointer-events-none z-10">
                </div>
                <img src="../../src/asset/images/seattle.png" alt="Seattle"
                  class="object-cover w-full h-full z-0 city-bg" />
                <div class="event-preview absolute left-0 right-0 bottom-2 z-20 flex flex-col items-center"></div>
                <span
                  class="absolute bottom-0 w-full text-center text-white text-xs sm:text-base font-semibold pb-4 pt-1 sm:pb-6 sm:pt-2 z-20 bg-gradient-to-t from-black/60 to-transparent city-name">Seattle</span>
              </div>
            </div>

            <!-- Quebec -->
            <div class="flex flex-col items-center min-w-[96px] sm:min-w-[120px]" data-city="Quebec">
              <div
                class="w-24 h-24 sm:w-48 sm:h-48 rounded-full border border-white shadow-[0_6px_12px_rgba(0,0,0,0.3)] overflow-hidden flex items-center justify-center relative city-image-container">
                <div
                  class="absolute inset-0 rounded-full shadow-[inset_0_4px_8px_rgba(255,255,255,0.9)] pointer-events-none z-10">
                </div>
                <img src="https://picsum.photos/100?random=1" alt="Quebec"
                  class="object-cover w-full h-full z-0 city-bg" />
                <div class="event-preview absolute left-0 right-0 bottom-2 z-20 flex flex-col items-center"></div>
                <span
                  class="absolute bottom-0 w-full text-center text-white text-xs sm:text-base font-semibold pb-4 pt-1 sm:pb-6 sm:pt-2 z-20 bg-gradient-to-t from-black/60 to-transparent city-name">Quebec</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Right Scroll Button -->
        <button id="scrollRightCities"
          class="absolute -right-14 top-1/2 mt-12 w-12 h-12 -translate-y-1/2 z-30 bg-white/30 text-white p-2 rounded-full hidden md:block cursor-pointer hover:bg-white/20 transition-colors">
          <i class="fa-solid fa-angle-right"></i>
        </button>
      </div>

      <!-- Featured Calendars Section -->
      <div class="mb-16 px-2">
        <h1
          class="font-bold flex-shrink-0 font-nunito text-3xl sm:text-4xl md:text-5xl lg:text-6xl luma-gradient h-20 md:h-28">
          Featured Calendars
        </h1>

        <!-- User's Calendar Events will be injected here -->
        <div id="userCalendarsGrid" class="grid gap-6 md:grid-cols-3 mb-8"></div>

        <!-- Removed static placeholder cards -->
        <div class="grid gap-6 md:grid-cols-3 px-4"></div>
      </div>
    </main>
  </div>

  <!--Footer section-->
  <div data-component="footer"></div>

  <!-- Scripts -->
  <script src="../../js/inject.js" defer></script>
  <script type="module" src="../../js/main.js" defer></script>
  <script src="../../js/hero-carousel.js" defer></script>

  <!-- Firebase & JS -->
  <script type="module" src="../../config/firebase.js"></script>
  <script type="module" src="../../js/event.js?v=2024"></script>
  <script type="module" src="../../js/auth/signout.js"></script>
  <script type="module" src="../../js/mobile-navbar.js"></script>

  <script type="module">
    import { initScrollButtons } from "../../js/scroll-buttons.js";

    initScrollButtons({
      containerId: "scroll-cities-container",
      leftBtnId: "scrollLeftCities",
      rightBtnId: "scrollRightCities",
      scrollStep: 300,
      autoScroll: true,
      autoScrollInterval: 2000, // every 2s
      initialScrollDelay: 1,  // start scroll quickly
      autoScrollPauseOnHover: true,
    });
  </script>

  <!-- Authentication Guard -->
  <script type="module">
    import { initAuthGuard } from "../../js/auth/authGuard.js";
    initAuthGuard();
  </script>
</body>

</html>
