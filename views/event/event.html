  <!-- Temporary Migration Script -->

    import { migrateComments } from "../../js/migrateComments.js";

    // Add migration button (temporary)
    setTimeout(() => {
      const migrationBtn = document.createElement("button");
      migrationBtn.onclick = () => {
        if (
          confirm(
            "Run comment migration? This will update existing comments with user information."

        ) {
          migrateComments();

      };
      document.body.appendChild(migrationBtn);
