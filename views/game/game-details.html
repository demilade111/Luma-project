<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luma | Game Details</title>
    <link href="../../src/output.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>

  <body class="bg-white font-nunito">
    <div data-component="sidebar"></div>

    <main class="px-10 text-white font-nunito">
      <div class="night-cage-wrap flex gap-8 p-8 items-start px-20">
        <!-- Game Image -->
        <div
          id="game-image"
          class="w-full max-w-[649px] aspect-square rounded-4xl overflow-hidden cursor-pointer"
        >
          <div class="loading-game-data">
            <i class="fas fa-spinner fa-spin text-4xl text-gray-400"></i>
            <p class="mt-4 text-gray-600">Loading game data...</p>
          </div>
        </div>

        <!-- Game Info -->
        <div class="flex flex-col gap-6 max-w-[700px]">
          <h3
            id="game-title"
            class="font-extrabold text-[42px] luma-gradient text-white"
          >
            Loading...
          </h3>
          <div class="gap-6">
            <h4
              id="game-subtitle"
              class="font-semibold text-[32px] text-white mb-4"
            >
              ...
            </h4>
            <p
              id="game-description"
              class="text-lg text-white pb-6 max-w-[80%]"
            >
              Loading game description...
            </p>
          </div>

          <!-- Stats -->
          <div id="game-stats" class="flex gap-6 text-sm text-gray-600">
            <p id="playing-time" class="text-gray-200">
              <span class="ml-2"><i class="fas fa-hourglass"></i></span>
              <span class="time-value">...</span>
            </p>
            <p id="player-count" class="text-gray-200">
              <span class="ml-2"><i class="fas fa-users"></i></span>
              <span class="players-value">...</span>
            </p>
            <p
              id="age-rating"
              class="border border-gray-200 text-gray-200 rounded-full p-0.5"
            >
              <span class="mx-2 age-value">...</span>
            </p>
            <p id="game-rating" class="text-gray-200">
              <span class="ml-2">&#9733;</span>
              <span class="rating-value">...</span>
            </p>
          </div>

          <!-- Buttons -->
          <div class="flex gap-4 flex-wrap">
            <button
              id="tutorial-btn"
              class="border border-gray-700 rounded-xl px-6 py-1 bg-[#2F364A] text-gray-200 shadow-[inset_-3px_-3px_8px_rgba(255,255,255,0.8)]"
            >
              Tutorial
            </button>
            <button
              id="share-btn"
              class="border border-gray-700 rounded-xl px-6 py-1 bg-[#2F364A] text-gray-200 shadow-[inset_-3px_-3px_8px_rgba(255,255,255,0.8)]"
            >
              Share
            </button>
            <button
              id="rules-btn"
              class="border border-gray-700 rounded-xl px-6 py-1 bg-[#2F364A] text-gray-200 shadow-[inset_-3px_-3px_8px_rgba(255,255,255,0.8)]"
            >
              Rules
            </button>
            <button
              id="bookmark-btn"
              class="border border-gray-700 rounded-xl px-6 py-1 bg-[#2F364A] text-gray-200 shadow-[inset_-3px_-3px_8px_rgba(255,255,255,0.8)]"
            >
              <i class="fa-regular fa-bookmark m-2 text-gray-500"></i>Bookmark
            </button>
          </div>
        </div>
      </div>

      <!-- Description, Categories -->
      <div class="py-10 lg:px-20">
        <div class="about-game flex gap-8 p-8 items-start">
          <div class="flex flex-col gap-6 max-w-[50%] text-white">
            <div id="designers-section">
              <h3 class="text-3xl font-semibold font-sans text-white">
                Designer
              </h3>
              <div id="designers-list" class="text-white text-2xl">
                Loading...
              </div>
            </div>
            <div id="publishers-section">
              <h3 class="text-3xl font-semibold font-sans text-white">
                Publisher
              </h3>
              <div id="publishers-list" class="text-white text-2xl">
                Loading...
              </div>
            </div>
            <div id="categories-section">
              <h3 class="text-3xl font-semibold font-sans text-white">
                Categories
              </h3>
              <div id="categories-list" class="text-white text-2xl">
                Loading...
              </div>
            </div>
          </div>

          <div class="flex flex-col gap-6 max-w-[40%] text-white">
            <h2 class="text-4xl font-extrabold text-white">About Game</h2>
            <p id="detailed-description" class="text-white">
              Loading detailed game description...
            </p>
          </div>
        </div>

        <!-- Suggested Games Section -->
        <div id="suggestedGamesSection" class="mb-10">
          <h2 class="text-3xl font-extrabold mb-4" style="color: #f59275">
            Suggested Games
          </h2>
          <div id="suggestedGamesGrid" class="flex gap-6 overflow-x-auto"></div>
        </div>

        <!-- Comments Section -->
        <div class="comments p-4 text-white">
          <h1
            class="text-6xl font-extrabold font-nunito gap-4 mb-4 p-4 text-center luma-gradient"
            style="
              background: linear-gradient(
                269deg,
                #f59275 24.95%,
                #f1647a 87.01%
              );
              background-clip: text;
              -webkit-background-clip: text;
              -webkit-text-fill-color: transparent;
              color: transparent;
            "
          >
            Comments
          </h1>
          <div class="max-w-7xl mx-auto">
            <div
              id="commentGrid"
              class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4"
            >
              <!-- Comment Input -->
              <div
                class="bg-gradient-to-b from-[#F59275] to-[#F1647A] p-[3px] rounded-2xl h-full"
              >
                <div
                  class="rounded-[16px] p-5 h-full flex flex-col justify-between"
                >
                  <textarea
                    id="commentInput"
                    style="
                      box-shadow: inset 0px 0px 18px -5px rgb(77 77 77 / 80%);
                    "
                    placeholder="Enter your comment..."
                    class="bg-[#FFC4C5] placeholder:text-gray-500 text-gray-700 rounded-lg p-4 resize-none h-48 focus:outline-none mb-4"
                  ></textarea>
                  <button
                    id="postCommentBtn"
                    style="box-shadow: 0px 0px 7px 0px rgb(77 77 77 / 80%)"
                    class="bg-gradient-to-r from-[#FF8E53] to-[#FE6B8B] text-white font-semibold px-6 py-3 rounded-2xl shadow-md"
                  >
                    Comment
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div data-component="footer"></div>

      <!-- PDF Preview Modal -->
      <div
        id="pdf-modal"
        class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center"
      >
        <div class="bg-white rounded-lg max-w-4xl max-h-[90vh] w-full mx-4">
          <div class="flex justify-between items-center p-4 border-b">
            <h3 class="text-lg font-semibold">Game Rules</h3>
            <button
              id="close-pdf-modal"
              class="text-gray-500 hover:text-gray-700"
            >
              <i class="fas fa-times text-xl"></i>
            </button>
          </div>
          <div class="p-4 h-[80vh] overflow-hidden">
            <iframe
              id="pdf-viewer"
              src=""
              class="w-full h-full border-0"
            ></iframe>
          </div>
          <div class="flex gap-4 p-4 border-t bg-gray-50">
            <button
              id="download-pdf"
              class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600"
            >
              <i class="fas fa-download mr-2"></i>Download PDF
            </button>
            <button
              id="close-pdf-modal-btn"
              class="px-4 py-2 bg-gray-500 text-white rounded hover:bg-gray-600"
            >
              Close
            </button>
          </div>
        </div>
      </div>
    </main>

    <!-- Script Includes -->
    <script src="../../service/gameService.js" defer></script>
    <script src="../../js/inject.js" defer></script>
    <script type="module" src="../../js/main.js"></script>
    <script src="../../js/hero-carousel.js" defer></script>
    <script type="module" src="../../js/auth/signout.js"></script>

    <!-- Authentication Guard -->
    <script type="module">
      import { initAuthGuard } from "../../js/auth/authGuard.js";
      initAuthGuard();
    </script>
  </body>
</html>
