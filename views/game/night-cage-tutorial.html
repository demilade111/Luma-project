<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luma | Tutorials</title>
    <link href="../../src/output.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="shortcut icon" href="/src/asset/images/Luma - Icon 1.png" />
</head>

<body class="bg-[#1A1F2C] font-nunito text-white min-h-screen overflow-x-hidden">
    <div data-component="sidebar"></div>

    <div class="flex-1 flex flex-col min-h-screen md:ml-[90px] pt-10">
        <main class="flex-1 p-4 md:py-10 md:px-20 max-w-full">
            <div class="flex flex-col lg:flex-row gap-10 items-center md:items-center max-w-full">
                <!-- Image Column -->
                <div class="w-full lg:w-1/2">
                    <img src="https://cf.geekdo-images.com/txQ7QzbQz89AO5BmVv7OqA__original/img/sj4Qg_VXKyNZFLftFjRv7p4-RKk=/0x0/filters:format(png)/pic5331288.png"
                        alt="The Night Cage"
                        class="w-full h-auto object-cover rounded-[32px] border border-black shadow-lg" />
                </div>

                <!-- Text Column -->
                <div class="w-full lg:w-1/2 flex flex-col justify-center space-y-14">
                    <h1
                        class="font-extrabold text-[28px] md:text-[52px] bg-gradient-to-r from-[#f59275] via-[#f1647a] to-[#f1647a] bg-clip-text text-transparent leading-tight">
                        The Night Cage Tutorial
                    </h1>

                    <p class="text-gray-400 text-base sm:text-lg md:text-xl">
                        An interactive play-along tutorial to be used as a companion to the
                        actual tabletop game. This tutorial allows you to learn the game
                        while you play!
                    </p>

                    <a href="/views/tutorial/tutorial.html"
                        style="box-shadow: -3px -3px 8px -3px rgba(255, 255, 255, 0.8)"
                        class="inline-flex items-center justify-center gap-4 mt-10 rounded-full bg-[#2f364a] px-8 py-4 md:px-12 md:py-6 shadow-md text-gray-200 text-lg md:text-2xl font-bold hover:bg-[#3A4258] transition-colors max-w-full">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 md:w-10 md:h-10" fill="currentColor"
                            viewBox="0 0 24 24">
                            <path d="M8 5v14l11-7z" />
                        </svg>
                        Start Tutorial
                    </a>

                </div>
            </div>
        </main>
    </div>

    <!-- Footer section -->
    <div data-component="footer"></div>

    <!-- External Scripts -->
    <script src="../../js/inject.js"></script>

    <!-- Authentication Guard -->
    <script type="module">
        import { initAuthGuard } from "../../js/auth/authGuard.js";
        initAuthGuard();
    </script>
</body>

</html>
