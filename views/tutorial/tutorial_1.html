<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luma | Tutorials</title>
    <link href="../../src/output.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>
  <body>
    <!--Sidebar section-->
    <div data-component="sidebar"></div>

    <!--Main section-->
    <main>
      <!--section tutorial 1-->
      <div class="tutorial-1 relative h-screen w-full">
        <img
          src="../../src/asset/images/nightcage.png"
          alt="Tutorial Image"
          class="w-full h-full object-cover"
        />
        <div
          class="absolute inset-0 flex items-center justify-center cursor-pointer"
        >
          <i
            class="play-buttons fas fa-play text-white text-6xl bg-white/50 p-6 rounded-2xl shadow-lg"
          ></i>
        </div>

        <!--hidden tutorials-->
        <video
          class="absolute inset-0 w-full h-full object-cover hidden"
          controls
          preload="metadata"
          playsinline
        >
          <source
            src="../../src/luma-tutorials/tutorial-Part1.mp4"
            type="video/mp4"
          />
          Your browser doesn't support the video.
        </video>

        <video
          class="absolute inset-0 w-full h-full object-cover hidden"
          controls
          preload="metadata"
          playsinline
        >
          <source
            src="../../src/luma-tutorials/tutorial-Part2.mp4"
            type="video/mp4"
          />
          Your browser doesn't support the video.
        </video>

        <video
          class="absolute inset-0 w-full h-full object-cover hidden"
          controls
          preload="metadata"
          playsinline
        >
          <source
            src="../../src/luma-tutorials/tutorial-Part3.mp4"
            type="video/mp4"
          />
          Your browser doesn't support the video.
        </video>
        <div class="absolute bottom-6 w-full flex justify-center">
          <div id="text-tutorial-intro" class="text-white w-[35%] p-6 py-2">
            An interactive play-along tutorial to be used as a companion to the
            actual tabletop game. This tutorial allows you to learn the game
            while you play!
          </div>
          <div
            id="video-controls"
            class="absolute bottom-20 left-1/2 transform -translate-x-1/2 flex gap-4 hidden"
          >
            <button
              id="prev-btn"
              class="bg-black/50 px-4 py-2 border border-white rounded-full text-white w-12 h-12 justify-center shadow text-xl hover:bg-black/70 transition-colors"
              title="Previous Video"
            >
              <i class="fas fa-play rotate-180"></i>
            </button>
            <button
              id="replay-btn"
              class="bg-black/50 px-4 py-2 border border-white rounded-full text-white w-12 h-12 justify-center shadow text-xl hover:bg-black/70 transition-colors"
              title="Replay Video"
            >
              <i class="fas fa-redo"></i>
            </button>
            <button
              id="next-btn"
              class="bg-black/50 px-4 py-2 border border-white rounded-full text-white w-12 h-12 justify-center shadow text-xl hover:bg-black/70 transition-colors"
              title="Next Video"
            >
              <i class="fas fa-play"></i>
            </button>
          </div>
        </div>
      </div>
    </main>

    <!--Footer section-->

    <div data-component="footer"></div>

    <!--script-->
    <script src="../../service/gameService.js" defer></script>
    <script src="../../js/inject.js" defer></script>
    <script src="../../js/main.js" type="module" defer></script>
    <script src="../../js/hero-carousel.js" defer></script>
  </body>
</html>
