<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luma | Tutorials</title>
    <link href="../../src/output.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  </head>
  <body>
    <!--Sidebar section-->
<div data-component="sidebar"></div>

<!--Main section-->
<main>
  <!--section tutorial 1-->
<div class="tutorial-1 relative h-screen w-full">
  <img src="/src/asset/images/nightcage.png" alt="Tutorial Image" class="w-full h-full object-cover">
  <div class="absolute inset-0 flex items-center justify-center cursor-pointer">
    <i class="fas fa-play text-white text-6xl bg-white/50 p-6 rounded-2xl shadow-lg"></i>
  </div>

  <!--hidden tutorials-->
  <video class="absolute inset-0 w-full h-full object-cover hidden" controls preload="metadata" playsinline>
    <source src="/src/luma-tutorials/tutorial-Part1.mp4" type="video/mp4"/>
    Your browser doesn't support the video.
  </video>

  <video class="absolute inset-0 w-full h-full object-cover hidden" controls preload="metadata" playsinline>
    <source src="/src/luma-tutorials/tutorial-Part2.mp4" type="video/mp4"/>
    Your browser doesn't support the video.
  </video>

  <video class="absolute inset-0 w-full h-full object-cover hidden" controls preload="metadata" playsinline>
    <source src="/src/luma-tutorials/tutorial-Part3.mp4" type="video/mp4"/>
    Your browser doesn't support the video.
  </video>
  <div class="absolute bottom-6 w-full flex justify-center">
  <div class="text-white p-6 py-2">
    An interactive play-along tutorial to be used as a companion to the actual tabletop game. This tutorial allows you to learn the game while you play!
  </div>
</div>
</div>

</main>







<!--Footer section-->

<div data-component="footer"></div>


<!--script-->
<script src="../../service/gameService.js" defer></script>
<script src="../../js/inject.js" defer></script>
<script src="../../js/main.js" defer></script>
<script src="../../js/hero-carousel.js" defer></script>

  </body>
</html>
