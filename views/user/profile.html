<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luma | Profile</title>
    <link href="../../src/output.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>

  <body class="bg-[#1A1F2C] font-nunito text-white min-h-screen">
    <div data-component="sidebar"></div>
    <div class="flex-1 flex flex-col min-h-screen ml-[90px] pt-10">
      <!--Game Details section-->
      <main class="flex-1 p-4 md:py-10 md:px-20">
        <div class="max-w-7xl mx-auto">
          <h1 class="text-[42px] luma-gradient font-bold mb-12">Profile</h1>

          <div class="grid grid-cols-1 lg:grid-cols-2 gap-12">
            <!-- Left Column - Profile Info -->
            <div class="bg-gray-800 rounded-2xl p-8 border border-gray-700">
              <div class="mb-8">
                <p class="text-gray-400 leading-relaxed mb-8">
                  Fusce nec lectus non risus tristique dapibus. Duis
                  ullamcorper, lacus quis congue ultrices
                </p>

                <!-- Profile Image -->
                <div class="flex justify-center mb-8">
                  <div
                    class="w-32 h-32 bg-gray-600 rounded-full flex items-center justify-center border-2 border-gray-500 hover:border-gray-400 transition-colors cursor-pointer"
                  >
                    <i class="fas fa-plus text-3xl text-gray-400"></i>
                  </div>
                </div>
              </div>

              <!-- City Dropdown -->
              <div class="mb-6">
                <label class="block text-gray-300 text-sm font-medium mb-2"
                  >City</label
                >
                <div class="relative">
                  <select
                    class="w-full bg-gray-700 border border-gray-600 text-gray-300 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-3 appearance-none"
                  >
                    <option>Add City</option>
                    <option>New York</option>
                    <option>Los Angeles</option>
                    <option>Chicago</option>
                    <option>Toronto</option>
                    <option>Vancouver</option>
                  </select>
                  <div
                    class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-400"
                  >
                    <i class="fas fa-chevron-down"></i>
                  </div>
                </div>
              </div>

              <!-- Gamer Level Dropdown -->
              <div class="mb-6">
                <label class="block text-gray-300 text-sm font-medium mb-2"
                  >Gamer Level</label
                >
                <div class="relative">
                  <select
                    class="w-full bg-gray-700 border border-gray-600 text-gray-300 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-3 appearance-none"
                  >
                    <option>Gamer level</option>
                    <option>Beginner</option>
                    <option>Intermediate</option>
                    <option>Advanced</option>
                    <option>Pro</option>
                  </select>
                  <div
                    class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-400"
                  >
                    <i class="fas fa-chevron-down"></i>
                  </div>
                </div>
              </div>
            </div>

            <!-- Right Column - Form -->
            <div class="space-y-6">
              <!-- Full Name -->
              <div>
                <label class="block text-gray-300 text-sm font-medium mb-2"
                  >Full name</label
                >
                <input
                  type="text"
                  placeholder="Add Name"
                  class="w-full bg-gray-700 border border-gray-600 text-gray-300 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-3 placeholder-gray-500"
                />
              </div>

              <!-- Email -->
              <div>
                <label class="block text-gray-300 text-sm font-medium mb-2"
                  >E-mail</label
                >
                <input
                  type="email"
                  placeholder="Add Email"
                  class="w-full bg-gray-700 border border-gray-600 text-gray-300 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-3 placeholder-gray-500"
                />
              </div>

              <!-- Birthday -->
              <div>
                <label class="block text-gray-300 text-sm font-medium mb-2"
                  >Birthday</label
                >
                <div class="grid grid-cols-3 gap-3">
                  <div class="relative">
                    <select
                      class="w-full bg-gray-700 border border-gray-600 text-gray-300 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-3 appearance-none"
                    >
                      <option>Month</option>
                      <option>January</option>
                      <option>February</option>
                      <option>March</option>
                      <option>April</option>
                      <option>May</option>
                      <option>June</option>
                      <option>July</option>
                      <option>August</option>
                      <option>September</option>
                      <option>October</option>
                      <option>November</option>
                      <option>December</option>
                    </select>
                    <div
                      class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-400"
                    >
                      <i class="fas fa-chevron-down"></i>
                    </div>
                  </div>
                  <div class="relative">
                    <select
                      class="w-full bg-gray-700 border border-gray-600 text-gray-300 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-3 appearance-none"
                    >
                      <option>Day</option>
                      <!-- Days 1-31 -->
                      <script>
                        for (let i = 1; i <= 31; i++) {
                          document.write(`<option value="${i}">${i}</option>`);
                        }
                      </script>
                    </select>
                    <div
                      class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-400"
                    >
                      <i class="fas fa-chevron-down"></i>
                    </div>
                  </div>
                  <div class="relative">
                    <select
                      class="w-full bg-gray-700 border border-gray-600 text-gray-300 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-3 appearance-none"
                    >
                      <option>Year</option>
                      <!-- Years from current year down to 1950 -->
                      <script>
                        const currentYear = new Date().getFullYear();
                        for (let year = currentYear; year >= 1950; year--) {
                          document.write(
                            `<option value="${year}">${year}</option>`
                          );
                        }
                      </script>
                    </select>
                    <div
                      class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-400"
                    >
                      <i class="fas fa-chevron-down"></i>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Password -->
              <div>
                <label class="block text-gray-300 text-sm font-medium mb-2"
                  >Password</label
                >
                <div class="relative">
                  <input
                    type="password"
                    placeholder="At least 8 characters"
                    class="w-full bg-gray-700 border border-gray-600 text-gray-300 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-3 pr-10 placeholder-gray-500"
                  />
                  <div
                    class="absolute inset-y-0 right-0 flex items-center px-3"
                  >
                    <i
                      class="fas fa-eye text-gray-400 cursor-pointer hover:text-gray-300"
                      onclick="togglePassword(this)"
                    ></i>
                  </div>
                </div>
              </div>

              <!-- Confirm Password -->
              <div>
                <label class="block text-gray-300 text-sm font-medium mb-2"
                  >Confirm Password</label
                >
                <div class="relative">
                  <input
                    type="password"
                    placeholder="Confirm Password"
                    class="w-full bg-gray-700 border border-gray-600 text-gray-300 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-3 pr-10 placeholder-gray-500"
                  />
                  <div
                    class="absolute inset-y-0 right-0 flex items-center px-3"
                  >
                    <i
                      class="fas fa-eye text-gray-400 cursor-pointer hover:text-gray-300"
                      onclick="togglePassword(this)"
                    ></i>
                  </div>
                </div>
              </div>

              <!-- Checkbox -->
              <div class="flex items-start">
                <input
                  type="checkbox"
                  class="w-4 h-4 text-blue-600 bg-gray-700 border-gray-600 rounded focus:ring-blue-500 focus:ring-2 mt-1"
                />
                <label class="ml-3 text-sm text-gray-400">
                  Vestibulum faucibus odio vitae arcu auctor lectus.
                </label>
              </div>

              <!-- Create Profile Button -->
              <div class="pt-6">
                <button
                  type="submit"
                  class="w-full bg-gray-600 hover:bg-gray-700 text-white font-medium rounded-lg text-lg px-6 py-4 transition-colors focus:ring-4 focus:ring-gray-500 focus:outline-none"
                >
                  Create Profile
                </button>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
    <div data-component="footer"></div>

    <!--Script-->
    <script src="../../js/inject.js" defer></script>
    <script type="module" src="../../js/profile.js"></script>

    <script>
      // Toggle password visibility
      function togglePassword(icon) {
        const input = icon.closest(".relative").querySelector("input");
        if (input.type === "password") {
          input.type = "text";
          icon.classList.remove("fa-eye");
          icon.classList.add("fa-eye-slash");
        } else {
          input.type = "password";
          icon.classList.remove("fa-eye-slash");
          icon.classList.add("fa-eye");
        }
      }

      // Profile image upload handler
      document
        .querySelector(".bg-gray-600.rounded-full")
        .addEventListener("click", function () {
          const input = document.createElement("input");
          input.type = "file";
          input.accept = "image/*";
          input.onchange = function (event) {
            const file = event.target.files[0];
            if (file) {
              const reader = new FileReader();
              reader.onload = function (e) {
                const imageContainer = document.querySelector(
                  ".bg-gray-600.rounded-full"
                );
                imageContainer.style.backgroundImage = `url(${e.target.result})`;
                imageContainer.style.backgroundSize = "cover";
                imageContainer.style.backgroundPosition = "center";
                imageContainer.innerHTML = "";
              };
              reader.readAsDataURL(file);
            }
          };
          input.click();
        });

      // Form validation
      document
        .querySelector('button[type="submit"]')
        .addEventListener("click", function (e) {
          e.preventDefault();

          const password = document.querySelector(
            'input[placeholder="At least 8 characters"]'
          ).value;
          const confirmPassword = document.querySelector(
            'input[placeholder="Confirm Password"]'
          ).value;

          if (password !== confirmPassword) {
            alert("Passwords do not match!");
            return;
          }

          if (password.length < 8) {
            alert("Password must be at least 8 characters long!");
            return;
          }

          // If validation passes
          alert("Profile created successfully!");
        });
    </script>

    <!-- Authentication Guard -->
    <script type="module">
      import { initAuthGuard } from "../../js/auth/authGuard.js";
      initAuthGuard();
    </script>
  </body>
</html>
