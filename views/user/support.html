<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luma | Profile</title>
    <link href="../../src/output.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>

  <body class="bg-[#1A1F2C] font-nunito text-white min-h-screen">
  <div data-component="mobilenavbar"></div>
    <div data-component="sidebar"></div>

    <div class="flex-1 flex flex-col min-h-screen md:ml-[90px] pt-10">
      <main class="flex-1 p-4 md:py-10 md:px-20">
        <h1 class="text-[42px] luma-gradient font-bold mb-12">Support</h1>
        <!-- support section -->
        <div class="flex flex-col md:flex-row md:items-stretch gap-8">
          <!-- Left: Image -->
          <div class="md:w-1/2">
            <img
              src="/src/asset/images/support.jpg"
              alt="Support Image"
              class="w-full h-full md:h-full object-cover rounded-2xl"
            />
          </div>

          <!-- Right: Content -->
          <div
            class="md:w-1/2 flex flex-col justify-center space-y-6 p-6 rounded-lg"
          >
            <h2 class="text-2xl font-medium text-gray-200">
              Having trouble with the app or a board game? We're here to help!
            </h2>
            <p class="text-gray-400">Can’t find players? Confused by a rule?</p>
            <p class="text-gray-400">
              Whether it’s a bug, a billing issue, or a game tutorial  that
              isn’t loading — we’ve got your back.
            </p>
            <p class="text-gray-400">
              Check our FAQ or reach out directly. We’ll get you  playing again
              in no time.
            </p>
            <div class="flex gap-4">
              <button
                style="box-shadow: -3px -3px 8px -3px rgba(255, 255, 255, 0.8)"
                class="border border-gray-700 rounded-xl px-6 py-2 bg-[#2F364A] text-gray-200 cursor-pointer hover:bg-[#3A4258] transition-colors"
              >
                Email Us
              </button>
              <button
                style="box-shadow: -3px -3px 8px -3px rgba(255, 255, 255, 0.8)"
                class="border border-gray-700 rounded-xl px-6 py-2 bg-[#2F364A] text-gray-200 cursor-pointer hover:bg-[#3A4258] transition-colors"
              >
                Browse FAQ
              </button>
            </div>
          </div>
        </div>
      </main>
    </div>

    <div data-component="footer"></div>

    <!-- External Scripts -->
    <script src="../../js/inject.js" defer></script>
    <script type="module" src="../../js/auth/signout.js"></script>
    <script type="module" src="../../js/mobile-navbar.js"></script>
  </body>
</html>
