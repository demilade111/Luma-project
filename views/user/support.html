<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luma | Support</title>
    <link href="../../src/output.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>
  <body class="bg-[#1A1F2C] text-white min-h-screen">
    <div class="min-h-screen p-8">
      <div class="max-w-4xl mx-auto">
        <h1 class="text-5xl font-bold text-gray-200 mb-12">Support</h1>

        <!-- Support Form -->
        <div class="space-y-8">
          <!-- Large Text Area -->
          <div class="bg-gray-800 rounded-2xl p-2 border border-gray-700">
            <textarea
              id="supportMessage"
              rows="12"
              placeholder="Describe your issue here..."
              class="w-full bg-transparent text-gray-300 placeholder-gray-500 resize-none focus:outline-none p-6 text-lg leading-relaxed"
            ></textarea>
          </div>

          <!-- Support Question Section -->
          <div class="text-center space-y-6">
            <h2 class="text-3xl font-semibold text-gray-300">
              Are you facing any problem?
            </h2>

            <p class="text-gray-400 leading-relaxed text-lg max-w-2xl mx-auto">
              Ut eget lacus iaculis, rutrum libero quis, fermentum orci.
              Pellentesque pellentesque enim non nisl scelerisque feugiat.
              Curabitur vulputate metus massa.
            </p>

            <!-- Action Buttons -->
            <div class="flex justify-center space-x-6 pt-6">
              <button
                id="submitSupport"
                class="bg-gray-600 hover:bg-gray-700 text-white font-medium rounded-2xl px-8 py-3 transition-colors focus:ring-4 focus:ring-gray-500 focus:outline-none"
              >
                Lorem Ipsum
              </button>

              <button
                id="cancelSupport"
                class="bg-gray-600 hover:bg-gray-700 text-white font-medium rounded-2xl px-8 py-3 transition-colors focus:ring-4 focus:ring-gray-500 focus:outline-none"
              >
                Lorem Ipsum
              </button>
            </div>
          </div>

          <!-- Additional Support Options -->
          <div class="mt-12 bg-gray-800 rounded-2xl p-6 border border-gray-700">
            <h3 class="text-xl font-semibold text-gray-200 mb-4">
              Quick Actions
            </h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
              <button
                class="support-option flex items-center p-4 bg-gray-700 hover:bg-gray-600 rounded-xl transition-colors"
              >
                <i class="fas fa-bug text-blue-400 mr-3 text-lg"></i>
                <span class="text-gray-300">Report Bug</span>
              </button>

              <button
                class="support-option flex items-center p-4 bg-gray-700 hover:bg-gray-600 rounded-xl transition-colors"
              >
                <i class="fas fa-lightbulb text-yellow-400 mr-3 text-lg"></i>
                <span class="text-gray-300">Feature Request</span>
              </button>

              <button
                class="support-option flex items-center p-4 bg-gray-700 hover:bg-gray-600 rounded-xl transition-colors"
              >
                <i
                  class="fas fa-question-circle text-green-400 mr-3 text-lg"
                ></i>
                <span class="text-gray-300">General Help</span>
              </button>
            </div>
          </div>

          <!-- Contact Information -->
          <div class="mt-8 text-center">
            <p class="text-gray-500 text-sm">
              Need immediate assistance? Contact us at
              <a
                href="mailto:support@luma.com"
                class="text-blue-400 hover:text-blue-300 underline"
              >
                support@luma.com
              </a>
            </p>
          </div>
        </div>
      </div>
    </div>

    <script>
      // Character counter for textarea
      const textarea = document.getElementById("supportMessage");
      const maxChars = 500;

      // Add character counter
      const counterDiv = document.createElement("div");
      counterDiv.className = "text-right text-gray-500 text-sm mt-2";
      counterDiv.textContent = `0 / ${maxChars}`;
      textarea.parentNode.appendChild(counterDiv);

      textarea.addEventListener("input", function () {
        const currentLength = this.value.length;
        counterDiv.textContent = `${currentLength} / ${maxChars}`;

        if (currentLength > maxChars) {
          counterDiv.classList.add("text-red-400");
          counterDiv.classList.remove("text-gray-500");
        } else {
          counterDiv.classList.remove("text-red-400");
          counterDiv.classList.add("text-gray-500");
        }
      });

      // Submit support request
      document
        .getElementById("submitSupport")
        .addEventListener("click", function () {
          const message = textarea.value.trim();

          if (!message) {
            alert("Please describe your issue before submitting.");
            textarea.focus();
            return;
          }

          if (message.length > maxChars) {
            alert(
              `Message is too long. Please keep it under ${maxChars} characters.`
            );
            return;
          }

          alert(
            "Support request submitted successfully! We'll get back to you soon."
          );
          textarea.value = "";
          counterDiv.textContent = `0 / ${maxChars}`;
        });

      // Cancel support request
      document
        .getElementById("cancelSupport")
        .addEventListener("click", function () {
          if (textarea.value.trim()) {
            if (confirm("Are you sure you want to discard your message?")) {
              textarea.value = "";
              counterDiv.textContent = `0 / ${maxChars}`;
            }
          }
        });

      // Quick action buttons
      document.querySelectorAll(".support-option").forEach((button) => {
        button.addEventListener("click", function () {
          const actionType = this.querySelector("span").textContent;
          textarea.value = `[${actionType}] `;
          textarea.focus();

          // Position cursor at the end
          textarea.setSelectionRange(
            textarea.value.length,
            textarea.value.length
          );
        });
      });

      // Auto-resize textarea
      textarea.addEventListener("input", function () {
        this.style.height = "auto";
        this.style.height = this.scrollHeight + "px";
      });
    </script>

    <!-- Authentication Guard -->
    <script type="module">
      import { initAuthGuard } from "../../js/auth/authGuard.js";
      initAuthGuard();
    </script>
  </body>
</html>
