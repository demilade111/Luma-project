<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luma | Preferences</title>
    <link href="../../src/output.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>
  <body class="bg-[#1A1F2C] text-white min-h-screen">
    <div class="flex min-h-screen">
      <!-- Left Sidebar -->
      <div class="w-80 bg-[#1A1F2C] border-r border-gray-700 p-6">
        <h1 class="text-5xl font-bold text-gray-200 mb-12">Preferences</h1>

        <nav class="space-y-2">
          <button
            class="category-nav block w-full text-left px-6 py-4 rounded-2xl bg-gray-600 text-white font-medium transition-colors"
            data-category="games"
          >
            Games
          </button>
          <button
            class="category-nav block w-full text-left px-6 py-4 rounded-2xl text-gray-400 hover:bg-gray-700 hover:text-white font-medium transition-colors"
            data-category="categories"
          >
            Categories
          </button>
          <button
            class="category-nav block w-full text-left px-6 py-4 rounded-2xl text-gray-400 hover:bg-gray-700 hover:text-white font-medium transition-colors"
            data-category="events"
          >
            Events
          </button>
          <button
            class="category-nav block w-full text-left px-6 py-4 rounded-2xl text-gray-400 hover:bg-gray-700 hover:text-white font-medium transition-colors"
            data-category="comments"
          >
            Comments
          </button>
        </nav>
      </div>

      <!-- Main Content -->
      <div class="flex-1 p-8">
        <div class="max-w-5xl mx-auto">
          <!-- Category Grid -->
          <div class="grid grid-cols-5 gap-4">
            <!-- Row 1 -->
            <button
              class="preference-item bg-gray-600 text-white px-6 py-4 rounded-2xl font-medium transition-all hover:bg-gray-500 selected"
            >
              Categories
            </button>
            <button
              class="preference-item bg-gray-800 text-gray-400 px-6 py-4 rounded-2xl font-medium transition-all hover:bg-gray-600 hover:text-white border border-gray-700"
            >
              Categories
            </button>
            <button
              class="preference-item bg-gray-800 text-gray-400 px-6 py-4 rounded-2xl font-medium transition-all hover:bg-gray-600 hover:text-white border border-gray-700"
            >
              Categories
            </button>
            <button
              class="preference-item bg-gray-800 text-gray-400 px-6 py-4 rounded-2xl font-medium transition-all hover:bg-gray-600 hover:text-white border border-gray-700"
            >
              Categories
            </button>
            <button
              class="preference-item bg-gray-600 text-white px-6 py-4 rounded-2xl font-medium transition-all hover:bg-gray-500 selected"
            >
              Categories
            </button>

            <!-- Row 2 -->
            <button
              class="preference-item bg-gray-800 text-gray-400 px-6 py-4 rounded-2xl font-medium transition-all hover:bg-gray-600 hover:text-white border border-gray-700"
            >
              Categories
            </button>
            <button
              class="preference-item bg-gray-800 text-gray-400 px-6 py-4 rounded-2xl font-medium transition-all hover:bg-gray-600 hover:text-white border border-gray-700"
            >
              Categories
            </button>
            <button
              class="preference-item bg-gray-800 text-gray-400 px-6 py-4 rounded-2xl font-medium transition-all hover:bg-gray-600 hover:text-white border border-gray-700"
            >
              Categories
            </button>
            <button
              class="preference-item bg-gray-800 text-gray-400 px-6 py-4 rounded-2xl font-medium transition-all hover:bg-gray-600 hover:text-white border border-gray-700"
            >
              Categories
            </button>
            <button
              class="preference-item bg-gray-800 text-gray-400 px-6 py-4 rounded-2xl font-medium transition-all hover:bg-gray-600 hover:text-white border border-gray-700"
            >
              Categories
            </button>

            <!-- Row 3 -->
            <button
              class="preference-item bg-gray-800 text-gray-400 px-6 py-4 rounded-2xl font-medium transition-all hover:bg-gray-600 hover:text-white border border-gray-700"
            >
              Categories
            </button>
            <button
              class="preference-item bg-gray-800 text-gray-400 px-6 py-4 rounded-2xl font-medium transition-all hover:bg-gray-600 hover:text-white border border-gray-700"
            >
              Categories
            </button>
            <button
              class="preference-item bg-gray-600 text-white px-6 py-4 rounded-2xl font-medium transition-all hover:bg-gray-500 selected"
            >
              Categories
            </button>
            <button
              class="preference-item bg-gray-600 text-white px-6 py-4 rounded-2xl font-medium transition-all hover:bg-gray-500 selected"
            >
              Categories
            </button>
            <button
              class="preference-item bg-gray-800 text-gray-400 px-6 py-4 rounded-2xl font-medium transition-all hover:bg-gray-600 hover:text-white border border-gray-700"
            >
              Categories
            </button>

            <!-- Row 4 -->
            <button
              class="preference-item bg-gray-600 text-white px-6 py-4 rounded-2xl font-medium transition-all hover:bg-gray-500 selected"
            >
              Categories
            </button>
            <button
              class="preference-item bg-gray-800 text-gray-400 px-6 py-4 rounded-2xl font-medium transition-all hover:bg-gray-600 hover:text-white border border-gray-700"
            >
              Categories
            </button>
            <button
              class="preference-item bg-gray-800 text-gray-400 px-6 py-4 rounded-2xl font-medium transition-all hover:bg-gray-600 hover:text-white border border-gray-700"
            >
              Categories
            </button>
            <button
              class="preference-item bg-gray-800 text-gray-400 px-6 py-4 rounded-2xl font-medium transition-all hover:bg-gray-600 hover:text-white border border-gray-700"
            >
              Categories
            </button>
            <button
              class="preference-item bg-gray-800 text-gray-400 px-6 py-4 rounded-2xl font-medium transition-all hover:bg-gray-600 hover:text-white border border-gray-700"
            >
              Categories
            </button>
          </div>

          <!-- Save Button -->
          <div class="mt-12 flex justify-center">
            <button
              id="savePreferences"
              class="bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-2xl px-8 py-3 transition-colors focus:ring-4 focus:ring-blue-500 focus:outline-none"
            >
              Save Preferences
            </button>
          </div>
        </div>
      </div>
    </div>

    <script>
      // Category navigation functionality
      document.querySelectorAll(".category-nav").forEach((nav) => {
        nav.addEventListener("click", function () {
          // Remove active state from all nav items
          document.querySelectorAll(".category-nav").forEach((item) => {
            item.classList.remove("bg-gray-600", "text-white");
            item.classList.add("text-gray-400");
          });

          // Add active state to clicked item
          this.classList.add("bg-gray-600", "text-white");
          this.classList.remove("text-gray-400");

          console.log("Selected category:", this.dataset.category);
        });
      });

      // Preference item selection functionality
      document.querySelectorAll(".preference-item").forEach((item) => {
        item.addEventListener("click", function () {
          if (this.classList.contains("selected")) {
            // Deselect
            this.classList.remove("selected", "bg-gray-600", "text-white");
            this.classList.add(
              "bg-gray-800",
              "text-gray-400",
              "border",
              "border-gray-700"
            );
          } else {
            // Select
            this.classList.add("selected", "bg-gray-600", "text-white");
            this.classList.remove(
              "bg-gray-800",
              "text-gray-400",
              "border",
              "border-gray-700"
            );
          }
        });
      });

      // Save preferences functionality
      document
        .getElementById("savePreferences")
        .addEventListener("click", function () {
          const selectedItems = document.querySelectorAll(
            ".preference-item.selected"
          );
          const selectedCount = selectedItems.length;

          alert(
            `Preferences saved! You have selected ${selectedCount} categories.`
          );
          console.log(
            "Selected preferences:",
            Array.from(selectedItems).map((item) => item.textContent)
          );
        });
    </script>
  </body>
</html>
