<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Luma | Home</title>

  <!-- Tailwind CSS -->
  <link href="../../src/output.css" rel="stylesheet" />

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />

  <!-- Custom Styles -->
  <style>
    .gradient-text {
      background: linear-gradient(269deg, #f59275 24.95%, #f1647a 87.01%);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Optional: hide native scrollbars */
    .scroll-hide::-webkit-scrollbar {
      display: none;
    }

    .scroll-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>

<body class="bg-gray-100 font-nunito overflow-x-hidden">
  <div data-component="sidebar"></div>

  <header class="relative">
    <div id="hero-container" data-component="hero"></div>
  </header>

  <div class="flex min-h-screen">
    <main class="flex-1 flex flex-col md:ml-[80px]">
      <div class="p-4 md:p-10 bg-[#1A1F2C] flex flex-col min-h-screen">

        <!-- Events Section -->
        <div class="w-full">
          <div class="px-4 sm:px-6 lg:px-12 space-y-16 rounded-lg">
            <a href="/views/event/event.html">
              <h2 class="text-2xl font-bold mb-6 text-[64px] luma-gradient">
                Events
              </h2>
            </a>
          </div>

          <!-- Trending Events -->
          <div class="px-4 sm:px-6 lg:px-12 mb-10">
            <h3 class="mb-4 text-[32px] font-bold text-[#FFA489]">Trending</h3>
            <div class="overflow-x-auto scroll-smooth pb-4 scroll-hide">
              <div id="trendingEventsGrid" class="flex gap-6 min-w-max">
                <!-- Dynamic cards injected here -->
              </div>
            </div>
          </div>

          <!-- Upcoming Events -->
          <div class="px-4 sm:px-6 lg:px-12 mb-10">
            <h3 class="mb-4 text-[32px] font-bold text-[#FFA489]">Upcoming</h3>
            <div class="overflow-x-auto scroll-smooth pb-4 scroll-hide">
              <div id="upcomingEventsGrid" class="flex gap-6 min-w-max">
                <!-- Dynamic cards injected here -->
              </div>
            </div>
          </div>
        </div>

        <!-- Games Section -->
        <div class="w-full">
          <div class="px-4 sm:px-6 lg:px-12 space-y-16 rounded-lg">
            <h2 class="text-2xl font-bold mb-6 text-[64px] luma-gradient">Games</h2>
          </div>

          <div class="px-4 sm:px-6 lg:px-12">
            <!-- Trending Games -->
            <div class="mb-10">
              <h3 class="mb-4 text-[32px] font-bold text-[#FFA489]">Trending</h3>

              <!-- Loading State -->
              <div id="home-games-loading" class="text-center py-8">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-white"></div>
                <p class="mt-2 text-gray-400">Loading games...</p>
              </div>

              <!-- Error State -->
              <div id="home-games-error" class="text-center py-8 hidden">
                <p class="text-red-400 mb-4">Failed to load games</p>
                <button id="retry-games" class="px-4 py-2 bg-red-500 text-white rounded hover:bg-red-600">
                  Retry
                </button>
              </div>

              <!-- Scrollable Games -->
              <div id="home-games-container" class="overflow-x-auto pb-4 hidden scroll-hide">
                <div id="home-games-list" class="flex gap-6 min-w-max">
                  <!-- Cards injected here -->
                </div>
              </div>
            </div>

            <!-- Continue Learning (Random Games) -->
            <div>
              <h3 class="mb-4 text-[32px] font-bold text-[#FFA489]">Continue Learning</h3>

              <div id="games-loading" class="text-center py-8">
                <i class="fas fa-spinner fa-spin text-2xl text-gray-400"></i>
                <p class="mt-2 text-gray-500">Loading games...</p>
              </div>

              <div id="games-error" class="hidden text-center py-8">
                <i class="fas fa-exclamation-triangle text-2xl text-red-400"></i>
                <p class="mt-2 text-red-500">Error loading games. Please try again.</p>
                <button id="retry-games" class="mt-4 px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">
                  Retry
                </button>
              </div>

              <div id="games-container" style="display: none;" class="grid-cols-1 lg:grid-cols-2 gap-10 md:gap-6 px-4">
                <!-- Grid-based games -->
              </div>

              <div id="random-games-container" class="flex overflow-x-auto gap-6 pb-4 scroll-smooth w-full">
                <!-- Random 4 games injected here -->
              </div>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <div data-component="footer"></div>

  <!-- JS Modules -->
  <script type="module">
    import { loadRandomGames } from "../../js/main.js";
    window.addEventListener("DOMContentLoaded", () => {
      loadRandomGames();
    });
  </script>

  <script type="module">
    import { initAuthGuard } from "../../js/auth/authGuard.js";
    initAuthGuard();
  </script>

  <!-- External Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="../../service/gameService.js"></script>
  <script src="../../js/inject.js"></script>
  <script type="module" src="../../js/main.js"></script>
  <script type="module" src="../../js/auth/signout.js"></script>
  <script src="../../js/hero-carousel.js" defer></script>
</body>

</html>
