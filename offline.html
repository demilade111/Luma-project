<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luma - Offline</title>
    <link href="/src/output.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <style>
      .luma-gradient {
        background: linear-gradient(135deg, #f59275 0%, #f1647a 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
    </style>
  </head>
  <body
    class="bg-[#1A1F2C] font-nunito text-white min-h-screen flex items-center justify-center"
  >
    <div class="text-center p-8 max-w-md">
      <div class="mb-8">
        <i class="fas fa-wifi-slash text-6xl text-gray-400 mb-4"></i>
        <h1 class="text-3xl font-bold luma-gradient mb-4">You're Offline</h1>
        <p class="text-gray-400 mb-6">
          Don't worry! You can still access some features of Luma while offline.
        </p>
      </div>

      <div class="space-y-4 mb-8">
        <div class="bg-[#2A2F45] rounded-lg p-4">
          <i class="fas fa-gamepad text-[#F59275] text-xl mb-2"></i>
          <h3 class="font-semibold mb-2">Browse Cached Games</h3>
          <p class="text-sm text-gray-400">
            View games you've previously loaded
          </p>
        </div>

        <div class="bg-[#2A2F45] rounded-lg p-4">
          <i class="fas fa-calendar text-[#F59275] text-xl mb-2"></i>
          <h3 class="font-semibold mb-2">View Saved Events</h3>
          <p class="text-sm text-gray-400">
            Check your previously loaded events
          </p>
        </div>

        <div class="bg-[#2A2F45] rounded-lg p-4">
          <i class="fas fa-user text-[#F59275] text-xl mb-2"></i>
          <h3 class="font-semibold mb-2">Profile Settings</h3>
          <p class="text-sm text-gray-400">Access your saved preferences</p>
        </div>
      </div>

      <button
        onclick="window.location.reload()"
        class="bg-gradient-to-r from-[#F59275] to-[#F1647A] text-white px-6 py-3 rounded-lg font-semibold hover:shadow-lg transition-all duration-300"
      >
        <i class="fas fa-sync-alt mr-2"></i>
        Try Again
      </button>

      <p class="text-xs text-gray-500 mt-6">
        Some features require an internet connection
      </p>
    </div>
  </body>
</html>
